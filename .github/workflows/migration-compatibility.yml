name: migration compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration_compatibility:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: hindsight_migrations_${{ github.run_id }}_${{ github.run_attempt }}
      DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
      EMBEDDING_PROVIDER: deterministic
      LLM_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: docker compose up -d crdb
      - name: Wait for CockroachDB
        run: |
          ready=false
          for _ in $(seq 1 30); do
            if docker compose exec -T crdb cockroach sql --insecure -e 'SELECT 1'; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker compose exec -T crdb cockroach sql --insecure \
            -e 'SET CLUSTER SETTING feature.vector_index.enabled = true'
      - name: Run isolated historical migration cases
        run: uv run python scripts/run_migration_compatibility.py --workers 4
      - name: Remove migration compatibility container
        if: always()
        run: docker compose down --volumes --remove-orphans
