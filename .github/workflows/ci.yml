name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
      && format('ci-pr-{0}', github.event.pull_request.number)
      || format('ci-main-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      python_static: ${{ steps.classify.outputs.python_static }}
      database: ${{ steps.classify.outputs.database }}
      main_qualification: ${{ steps.classify.outputs.main_qualification }}
      frontend: ${{ steps.classify.outputs.frontend }}
      lambda_artifacts: ${{ steps.classify.outputs.lambda_artifacts }}
      terraform: ${{ steps.classify.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/ci_changes.py
          --event-name "$EVENT_NAME"
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  python_static:
    needs: changes
    if: needs.changes.outputs.python_static == 'true'
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run pip-audit --cache-dir "$RUNNER_TEMP/pip-audit"
      - run: uv run python scripts/ci_test_groups.py validate
      - run: uv run ruff check .
      - run: uv run python scripts/ci_test_groups.py run unit

  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    timeout-minutes: 30
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      COMPOSE_PROJECT_NAME: hindsight_ci_${{ github.run_id }}_${{ github.run_attempt }}_database
      DATABASE_URL: postgresql://root@localhost:26257/hindsight_product_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: docker compose up -d crdb
      - name: Wait for CockroachDB
        run: |
          ready=false
          for _ in $(seq 1 30); do
            if docker compose exec -T crdb cockroach sql --insecure -e 'SELECT 1'; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker compose exec -T crdb cockroach sql --insecure \
            -e 'SET CLUSTER SETTING feature.vector_index.enabled = true'
      - name: Run affected product checks
        run: |
          uv run python scripts/migrate.py
          uv run python scripts/initialize_agent_storage.py
          uv run python scripts/ci_test_groups.py run product
      - name: Remove product database container
        if: always()
        run: docker compose down --volumes --remove-orphans

  main_qualification:
    needs: changes
    if: needs.changes.outputs.main_qualification == 'true'
    timeout-minutes: 30
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      COMPOSE_PROJECT_NAME: hindsight_ci_${{ github.run_id }}_${{ github.run_attempt }}_main
      FRESH_DATABASE_URL: postgresql://root@localhost:26257/hindsight_fresh_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
      POPULATED_DATABASE_URL: postgresql://root@localhost:26257/hindsight_populated_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: docker compose up -d crdb
      - name: Wait for CockroachDB
        run: |
          ready=false
          for _ in $(seq 1 30); do
            if docker compose exec -T crdb cockroach sql --insecure -e 'SELECT 1'; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker compose exec -T crdb cockroach sql --insecure \
            -e 'SET CLUSTER SETTING feature.vector_index.enabled = true'
      - name: Establish shared migration roles
        run: |
          docker compose exec -T crdb cockroach sql --insecure \
            -e 'CREATE ROLE IF NOT EXISTS hindsight_lifecycle NOLOGIN'
      - name: Verify populated upgrade and schema parity
        run: |
          mkdir -p build/schema
          (
            DATABASE_URL="$FRESH_DATABASE_URL" uv run python scripts/migrate.py
            DATABASE_URL="$FRESH_DATABASE_URL" uv run python scripts/initialize_agent_storage.py
          ) >build/schema/fresh.log 2>&1 &
          fresh_pid=$!
          (
            DATABASE_URL="$POPULATED_DATABASE_URL" uv run python scripts/migrate.py \
              --through 0018_agent_run_attempt_fencing.sql
            DATABASE_URL="$POPULATED_DATABASE_URL" uv run python scripts/populated_upgrade_fixture.py seed
            DATABASE_URL="$POPULATED_DATABASE_URL" uv run python scripts/migrate.py
            DATABASE_URL="$POPULATED_DATABASE_URL" uv run python scripts/initialize_agent_storage.py
            DATABASE_URL="$POPULATED_DATABASE_URL" uv run python scripts/populated_upgrade_fixture.py verify
          ) >build/schema/populated.log 2>&1 &
          populated_pid=$!
          set +e
          wait "$fresh_pid"; fresh_status=$?
          wait "$populated_pid"; populated_status=$?
          set -e
          cat build/schema/fresh.log build/schema/populated.log
          test "$fresh_status" -eq 0
          test "$populated_status" -eq 0

          DATABASE_URL="$FRESH_DATABASE_URL" uv run python scripts/schema_manifest.py export \
            --apply-roles --output build/schema/fresh.json
          DATABASE_URL="$POPULATED_DATABASE_URL" uv run python scripts/schema_manifest.py export \
            --apply-roles --output build/schema/populated.json
          uv run python scripts/schema_manifest.py compare \
            build/schema/fresh.json build/schema/populated.json
      - name: Remove main qualification container
        if: always()
        run: docker compose down --volumes --remove-orphans

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:web
      - run: npm run check:web
      - run: npm run test:web
      - run: npm run build:web
      - run: git diff --exit-code -- src/hindsight/web

  lambda_artifacts:
    needs: changes
    if: needs.changes.outputs.lambda_artifacts == 'true'
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run python scripts/build_lambda_artifacts.py
      - run: uv run python scripts/smoke_lambda_artifacts.py

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/cache@v4
        with:
          path: .terraform.d/plugin-cache
          key: >-
            terraform-${{ runner.os }}-
            ${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: infra/terraform
          trivy-config: infra/terraform/trivy.yaml
          severity: HIGH,CRITICAL
          exit-code: 1
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform/bootstrap validate
      - run: terraform -chdir=infra/terraform/bootstrap test
      - run: terraform -chdir=infra/terraform/app init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform/app validate
      - run: terraform -chdir=infra/terraform/app test
      - run: terraform -chdir=infra/terraform/edge init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform/edge validate
      - run: terraform -chdir=infra/terraform/edge test

  test:
    if: always()
    needs:
      - changes
      - python_static
      - database
      - main_qualification
      - frontend
      - lambda_artifacts
      - terraform
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      CI_SELECTIONS: >-
        {"python_static":"${{ needs.changes.outputs.python_static }}",
        "database":"${{ needs.changes.outputs.database }}",
        "main_qualification":"${{ needs.changes.outputs.main_qualification }}",
        "frontend":"${{ needs.changes.outputs.frontend }}",
        "lambda_artifacts":"${{ needs.changes.outputs.lambda_artifacts }}",
        "terraform":"${{ needs.changes.outputs.terraform }}"}
      CI_RESULTS: >-
        {"changes":"${{ needs.changes.result }}",
        "python_static":"${{ needs.python_static.result }}",
        "database":"${{ needs.database.result }}",
        "main_qualification":"${{ needs.main_qualification.result }}",
        "frontend":"${{ needs.frontend.result }}",
        "lambda_artifacts":"${{ needs.lambda_artifacts.result }}",
        "terraform":"${{ needs.terraform.result }}"}
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_ci_components.py
