name: deploy demo

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan only or apply after protected approval
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
      health_only:
        description: Stop after exact-main deployment health checks
        required: true
        type: boolean
        default: true
      enable_bounded_observability:
        description: Enable the opt-in cost-bounded ADOT/X-Ray profile
        required: true
        type: boolean
        default: false
      adot_python_layer_arn:
        description: Confirmed region-matched ADOT Python Lambda layer ARN
        required: false
        type: string
        default: ""
      deployment_environment:
        description: Protected GitHub environment containing one AWS account configuration
        required: true
        type: choice
        default: demo
        options:
          - demo
          - demo-candidate
  workflow_call:
    inputs:
      apply:
        description: Apply the reviewed Terraform plan
        required: false
        type: boolean
        default: false
      validation_mode:
        description: Restrict deployment to the owner-authorized product acceptance caller
        required: false
        type: boolean
        default: false
      embedding_max_distance:
        description: Precommitted active-profile cosine-distance cutoff
        required: false
        type: string
        default: "0.35"
      health_only:
        description: Stop after deployment health checks
        required: false
        type: boolean
        default: false
      enable_bounded_observability:
        description: Enable the opt-in cost-bounded ADOT/X-Ray profile
        required: false
        type: boolean
        default: false
      adot_python_layer_arn:
        description: Confirmed region-matched ADOT Python Lambda layer ARN
        required: false
        type: string
        default: ""
      source_sha:
        description: Exact caller-authorized revision to deploy
        required: true
        type: string
      deployment_environment:
        description: Protected GitHub environment containing one AWS account configuration
        required: false
        type: string
        default: demo
    secrets:
      HINDSIGHT_ALERT_RECIPIENT:
        description: Optional confirmed email recipient for operational and budget alerts
        required: false
    outputs:
      ui_url:
        description: Deployed CloudFront/custom-domain URL
        value: ${{ jobs.apply.outputs.ui_url }}
      api_url:
        description: Deployed HTTP API endpoint
        value: ${{ jobs.apply.outputs.api_url }}
      websocket_url:
        description: Deployed WebSocket endpoint
        value: ${{ jobs.apply.outputs.websocket_url }}
      cognito_user_pool_id:
        description: Product Cognito user pool
        value: ${{ jobs.apply.outputs.cognito_user_pool_id }}
      cognito_user_pool_client_id:
        description: Product browser client
        value: ${{ jobs.apply.outputs.cognito_user_pool_client_id }}
      worker_timeout_seconds:
        description: Applied worker timeout
        value: ${{ jobs.apply.outputs.worker_timeout_seconds }}
      run_attempt_lease_seconds:
        description: Applied durable run-attempt lease
        value: ${{ jobs.apply.outputs.run_attempt_lease_seconds }}
      run_queue_visibility_seconds:
        description: Applied source and dead-letter queue visibility
        value: ${{ jobs.apply.outputs.run_queue_visibility_seconds }}
      run_max_attempts:
        description: Applied run-attempt and redrive budget
        value: ${{ jobs.apply.outputs.run_max_attempts }}
      run_dispatch_schedule_seconds:
        description: Applied dispatcher cadence
        value: ${{ jobs.apply.outputs.run_dispatch_schedule_seconds }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ inputs.validation_mode && format('hindsight-live-deploy-{0}-{1}', inputs.deployment_environment || 'demo', github.run_id) || format('hindsight-{0}-environment-v2', inputs.deployment_environment || 'demo') }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_validation_mode: ${{ inputs.validation_mode && 'true' || 'false' }}
  TF_VAR_enable_bounded_observability: ${{ inputs.enable_bounded_observability && 'true' || 'false' }}
  DEPLOY_DATABASE_PARAMETER: ${{ vars.HINDSIGHT_DEPLOY_DATABASE_URL_PARAM || '/hindsight/demo/database-url' }}
  TF_VAR_api_database_url_parameter_name: ${{ vars.HINDSIGHT_API_DATABASE_URL_PARAM || '/hindsight/demo/api-database-url' }}
  TF_VAR_worker_database_url_parameter_name: ${{ vars.HINDSIGHT_WORKER_DATABASE_URL_PARAM || '/hindsight/demo/worker-database-url' }}
  TF_VAR_gemini_api_keys_parameter_name: ${{ vars.HINDSIGHT_GEMINI_API_KEYS_PARAM || '/hindsight/demo/gemini-api-keys' }}
  TF_VAR_changefeed_token_parameter_name: ${{ vars.HINDSIGHT_CHANGEFEED_TOKEN_PARAM || '/hindsight/demo/changefeed-token' }}
  TF_VAR_enable_waf: ${{ vars.HINDSIGHT_ENABLE_WAF || 'false' }}
  TF_VAR_llm_provider: ${{ inputs.validation_mode && 'gemini' || vars.HINDSIGHT_LLM_PROVIDER || 'gemini' }}
  TF_VAR_gemini_model: ${{ vars.HINDSIGHT_GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
  TF_VAR_embedding_provider: ${{ inputs.validation_mode && 'gemini' || vars.HINDSIGHT_EMBEDDING_PROVIDER || 'gemini' }}
  TF_VAR_gemini_embedding_model: ${{ vars.HINDSIGHT_GEMINI_EMBEDDING_MODEL || 'gemini-embedding-2' }}
  TF_VAR_gemini_embedding_representation: ${{ vars.HINDSIGHT_GEMINI_REPRESENTATION || 'raw_control' }}
  TF_VAR_domain_name: ${{ vars.HINDSIGHT_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io' }}
  TF_VAR_acm_certificate_arn: ${{ vars.HINDSIGHT_ACM_CERTIFICATE_ARN }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  EMBEDDING_MAX_DISTANCE: ${{ inputs.embedding_max_distance || '0.35' }}

jobs:
  authorize:
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL }}
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      should_apply: ${{ steps.authorize.outputs.should_apply }}
      source_sha: ${{ steps.authorize.outputs.source_sha }}
      deployment_environment: ${{ steps.authorize.outputs.deployment_environment }}
    steps:
      - id: authorize
        name: Authorize deployment source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          MANUAL_OPERATION: ${{ inputs.operation }}
          REQUESTED_APPLY: ${{ inputs.apply }}
          REQUESTED_HEALTH_ONLY: ${{ inputs.health_only }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          VALIDATION_MODE: ${{ inputs.validation_mode }}
          CALLER_WORKFLOW: ${{ github.workflow }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REQUESTED_ENVIRONMENT: ${{ inputs.deployment_environment || 'demo' }}
        shell: bash
        run: |
          REQUESTED_ENVIRONMENT="${REQUESTED_ENVIRONMENT:-demo}"
          [[ "$REQUESTED_ENVIRONMENT" == "demo" || "$REQUESTED_ENVIRONMENT" == "demo-candidate" ]] || {
            echo "Unsupported deployment environment." >&2
            exit 1
          }
          if [[ "$VALIDATION_MODE" == "true" ]]; then
            [[ "$REQUESTED_APPLY" == "true" \
              && "$REQUESTED_HEALTH_ONLY" == "false" \
              && "$CALLER_WORKFLOW" == "live acceptance" \
              && "$CALLER_WORKFLOW_REF" == "$REPOSITORY/.github/workflows/live-acceptance.yml@$REF_NAME" \
              && "$EVENT_NAME" == "workflow_dispatch" \
              && "$REF_NAME" == "refs/heads/main" \
              && "$REQUESTED_SOURCE_SHA" == "$EVENT_SHA" \
              && "$ACTOR" == "$REPOSITORY_OWNER" \
              && "$TRIGGERING_ACTOR" == "$REPOSITORY_OWNER" \
              && "$EMBEDDING_MAX_DISTANCE" == "0.35" ]] || {
              echo "Validation deployment requires the owner-authorized live-acceptance workflow." >&2
              exit 1
            }
            [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Validation deployment did not resolve a commit SHA." >&2
              exit 1
            }
            {
              echo "authorized=true"
              echo "should_apply=true"
              echo "source_sha=$REQUESTED_SOURCE_SHA"
              echo "deployment_environment=$REQUESTED_ENVIRONMENT"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REF_NAME" == "refs/heads/main" \
              && "$CALLER_WORKFLOW" == "deploy demo" \
              && "$CALLER_WORKFLOW_REF" == "$REPOSITORY/.github/workflows/deploy-demo.yml@$REF_NAME" \
              && "$ACTOR" == "$REPOSITORY_OWNER" \
              && "$TRIGGERING_ACTOR" == "$REPOSITORY_OWNER" ]] || {
              echo "Manual demo deployments require the repository owner on main." >&2
              exit 1
            }
            [[ "$MANUAL_OPERATION" == "plan" || "$MANUAL_OPERATION" == "apply" ]] || {
              echo "Unsupported manual deployment operation." >&2
              exit 1
            }
            [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Manual deployment did not resolve a commit SHA." >&2
              exit 1
            }
            {
              echo "authorized=true"
              if [[ "$MANUAL_OPERATION" == "apply" ]]; then
                echo "should_apply=true"
              else
                echo "should_apply=false"
              fi
              echo "source_sha=$EVENT_SHA"
              echo "deployment_environment=$REQUESTED_ENVIRONMENT"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unsupported deployment event: $EVENT_NAME" >&2
          exit 1

  plan:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL }}
    environment: ${{ needs.authorize.outputs.deployment_environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEPLOYMENT_ENVIRONMENT: ${{ needs.authorize.outputs.deployment_environment }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'hindsight/demo/terraform.tfstate' }}
      SOURCE_STATE_KEY: ${{ vars.HINDSIGHT_SOURCE_STATE_KEY || 'hindsight/demo/terraform.tfstate' }}
      SOURCE_DOMAIN_NAME: ${{ vars.HINDSIGHT_SOURCE_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io' }}
      TF_VAR_stage: ${{ vars.HINDSIGHT_STAGE || 'demo' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_api_database_url_parameter_name: ${{ vars.HINDSIGHT_API_DATABASE_URL_PARAM || '/hindsight/demo/api-database-url' }}
      TF_VAR_worker_database_url_parameter_name: ${{ vars.HINDSIGHT_WORKER_DATABASE_URL_PARAM || '/hindsight/demo/worker-database-url' }}
      TF_VAR_gemini_api_keys_parameter_name: ${{ vars.HINDSIGHT_GEMINI_API_KEYS_PARAM || '/hindsight/demo/gemini-api-keys' }}
      TF_VAR_changefeed_token_parameter_name: ${{ vars.HINDSIGHT_CHANGEFEED_TOKEN_PARAM || '/hindsight/demo/changefeed-token' }}
      TF_VAR_enable_waf: ${{ vars.HINDSIGHT_ENABLE_WAF || 'false' }}
      TF_VAR_domain_name: ${{ vars.HINDSIGHT_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io' }}
      TF_VAR_public_origin: ${{ vars.HINDSIGHT_PUBLIC_ORIGIN || format('https://{0}', vars.HINDSIGHT_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io') }}
      TF_VAR_cloudfront_aliases: ${{ vars.HINDSIGHT_CLOUDFRONT_ALIASES || format('["{0}"]', vars.HINDSIGHT_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io') }}
      TF_VAR_manage_public_dns: ${{ vars.HINDSIGHT_MANAGE_PUBLIC_DNS || 'true' }}
      TF_VAR_runtime_active: ${{ vars.HINDSIGHT_RUNTIME_ACTIVE || 'true' }}
      TF_VAR_acm_certificate_arn: ${{ vars.HINDSIGHT_ACM_CERTIFICATE_ARN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_deployed_revision: ${{ needs.authorize.outputs.source_sha }}
    outputs:
      artifact_name: ${{ steps.plan_name.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: hashicorp/setup-terraform@v4
      - uses: actions/cache@v6
        with:
          path: .terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure bounded observability inputs
        if: inputs.enable_bounded_observability == true
        env:
          ADOT_PYTHON_LAYER_ARN: ${{ inputs.adot_python_layer_arn || vars.HINDSIGHT_ADOT_PYTHON_LAYER_ARN }}
          ALERT_RECIPIENT: ${{ secrets.HINDSIGHT_ALERT_RECIPIENT }}
        shell: bash
        run: |
          layer_pattern="^arn:aws:lambda:${AWS_REGION}:901920570463:layer:aws-otel-python-amd64-ver-[0-9]+-[0-9]+-[0-9]+:[1-9][0-9]*$"
          [[ "$ADOT_PYTHON_LAYER_ARN" =~ $layer_pattern ]] || {
            echo "Bounded observability requires a confirmed ADOT Python layer ARN in $AWS_REGION." >&2
            exit 1
          }
          echo "TF_VAR_adot_python_layer_arn=$ADOT_PYTHON_LAYER_ARN" >> "$GITHUB_ENV"
          if [[ -n "$ALERT_RECIPIENT" ]]; then
            [[ "$ALERT_RECIPIENT" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]] || {
              echo "The configured alert recipient is not a valid email address." >&2
              exit 1
            }
            echo "::add-mask::$ALERT_RECIPIENT"
            echo "TF_VAR_alert_email=$ALERT_RECIPIENT" >> "$GITHUB_ENV"
          fi
      - run: uv sync --frozen
      - name: Verify deployment account and state identity
        run: >-
          uv run python scripts/deployment_identity_preflight.py
          --expected-account-id "$EXPECTED_AWS_ACCOUNT_ID"
          --region "$AWS_REGION"
          --state-bucket "$TF_STATE_BUCKET"
          --certificate-arn "$TF_VAR_acm_certificate_arn"
          --deployment-environment "$DEPLOYMENT_ENVIRONMENT"
          --stage "$TF_VAR_stage"
          --state-key "$TF_STATE_KEY"
          --domain-name "$TF_VAR_domain_name"
          --source-state-key "$SOURCE_STATE_KEY"
          --source-domain-name "$SOURCE_DOMAIN_NAME"
      - run: uv run python scripts/build_lambda_artifacts.py
      - name: Record deployment artifact identities
        shell: bash
        run: sha256sum build/lambda-artifacts/*.zip > build/lambda-artifacts.sha256
      - name: Initialize remote state
        run: >-
          terraform -chdir=infra/terraform/app init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TF_STATE_KEY"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Create deployment plan
        run: terraform -chdir=infra/terraform/app plan -input=false -out="$GITHUB_WORKSPACE/build/demo.tfplan"
      - id: plan_name
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ needs.authorize.outputs.deployment_environment }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: echo "name=${DEPLOYMENT_ENVIRONMENT}-plan-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan_name.outputs.name }}
          path: |
            build/demo.tfplan
            build/lambda-artifacts/*.zip
            build/lambda-artifacts.sha256
          retention-days: 90

  apply:
    needs:
      - authorize
      - plan
    if: needs.authorize.outputs.should_apply == 'true'
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL }}
    timeout-minutes: 60
    environment: ${{ needs.authorize.outputs.deployment_environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEPLOYMENT_ENVIRONMENT: ${{ needs.authorize.outputs.deployment_environment }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'hindsight/demo/terraform.tfstate' }}
      SOURCE_STATE_KEY: ${{ vars.HINDSIGHT_SOURCE_STATE_KEY || 'hindsight/demo/terraform.tfstate' }}
      SOURCE_DOMAIN_NAME: ${{ vars.HINDSIGHT_SOURCE_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io' }}
      TF_VAR_stage: ${{ vars.HINDSIGHT_STAGE || 'demo' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEPLOY_DATABASE_PARAMETER: ${{ vars.HINDSIGHT_DEPLOY_DATABASE_URL_PARAM || '/hindsight/demo/database-url' }}
      TF_VAR_api_database_url_parameter_name: ${{ vars.HINDSIGHT_API_DATABASE_URL_PARAM || '/hindsight/demo/api-database-url' }}
      TF_VAR_worker_database_url_parameter_name: ${{ vars.HINDSIGHT_WORKER_DATABASE_URL_PARAM || '/hindsight/demo/worker-database-url' }}
      TF_VAR_gemini_api_keys_parameter_name: ${{ vars.HINDSIGHT_GEMINI_API_KEYS_PARAM || '/hindsight/demo/gemini-api-keys' }}
      TF_VAR_changefeed_token_parameter_name: ${{ vars.HINDSIGHT_CHANGEFEED_TOKEN_PARAM || '/hindsight/demo/changefeed-token' }}
      TF_VAR_enable_waf: ${{ vars.HINDSIGHT_ENABLE_WAF || 'false' }}
      TF_VAR_domain_name: ${{ vars.HINDSIGHT_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io' }}
      TF_VAR_public_origin: ${{ vars.HINDSIGHT_PUBLIC_ORIGIN || format('https://{0}', vars.HINDSIGHT_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io') }}
      TF_VAR_cloudfront_aliases: ${{ vars.HINDSIGHT_CLOUDFRONT_ALIASES || format('["{0}"]', vars.HINDSIGHT_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io') }}
      TF_VAR_manage_public_dns: ${{ vars.HINDSIGHT_MANAGE_PUBLIC_DNS || 'true' }}
      TF_VAR_runtime_active: ${{ vars.HINDSIGHT_RUNTIME_ACTIVE || 'true' }}
      TF_VAR_acm_certificate_arn: ${{ vars.HINDSIGHT_ACM_CERTIFICATE_ARN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    outputs:
      ui_url: ${{ steps.stack_outputs.outputs.ui_url }}
      api_url: ${{ steps.stack_outputs.outputs.api_url }}
      websocket_url: ${{ steps.stack_outputs.outputs.websocket_url }}
      cognito_user_pool_id: ${{ steps.stack_outputs.outputs.cognito_user_pool_id }}
      cognito_user_pool_client_id: ${{ steps.stack_outputs.outputs.cognito_user_pool_client_id }}
      worker_timeout_seconds: ${{ steps.stack_outputs.outputs.worker_timeout_seconds }}
      run_attempt_lease_seconds: ${{ steps.stack_outputs.outputs.run_attempt_lease_seconds }}
      run_queue_visibility_seconds: ${{ steps.stack_outputs.outputs.run_queue_visibility_seconds }}
      run_max_attempts: ${{ steps.stack_outputs.outputs.run_max_attempts }}
      run_dispatch_schedule_seconds: ${{ steps.stack_outputs.outputs.run_dispatch_schedule_seconds }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: hashicorp/setup-terraform@v4
      - uses: actions/cache@v6
        with:
          path: .terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure bounded observability inputs
        if: inputs.enable_bounded_observability == true
        env:
          ADOT_PYTHON_LAYER_ARN: ${{ inputs.adot_python_layer_arn || vars.HINDSIGHT_ADOT_PYTHON_LAYER_ARN }}
          ALERT_RECIPIENT: ${{ secrets.HINDSIGHT_ALERT_RECIPIENT }}
        shell: bash
        run: |
          layer_pattern="^arn:aws:lambda:${AWS_REGION}:901920570463:layer:aws-otel-python-amd64-ver-[0-9]+-[0-9]+-[0-9]+:[1-9][0-9]*$"
          [[ "$ADOT_PYTHON_LAYER_ARN" =~ $layer_pattern ]] || {
            echo "Bounded observability requires a confirmed ADOT Python layer ARN in $AWS_REGION." >&2
            exit 1
          }
          echo "TF_VAR_adot_python_layer_arn=$ADOT_PYTHON_LAYER_ARN" >> "$GITHUB_ENV"
          if [[ -n "$ALERT_RECIPIENT" ]]; then
            [[ "$ALERT_RECIPIENT" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]] || {
              echo "The configured alert recipient is not a valid email address." >&2
              exit 1
            }
            echo "::add-mask::$ALERT_RECIPIENT"
            echo "TF_VAR_alert_email=$ALERT_RECIPIENT" >> "$GITHUB_ENV"
          fi
      - run: uv sync --frozen
      - name: Verify deployment account and state identity
        run: >-
          uv run python scripts/deployment_identity_preflight.py
          --expected-account-id "$EXPECTED_AWS_ACCOUNT_ID"
          --region "$AWS_REGION"
          --state-bucket "$TF_STATE_BUCKET"
          --certificate-arn "$TF_VAR_acm_certificate_arn"
          --deployment-environment "$DEPLOYMENT_ENVIRONMENT"
          --stage "$TF_VAR_stage"
          --state-key "$TF_STATE_KEY"
          --domain-name "$TF_VAR_domain_name"
          --source-state-key "$SOURCE_STATE_KEY"
          --source-domain-name "$SOURCE_DOMAIN_NAME"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: build
      - name: Verify planned deployment artifacts
        run: sha256sum --check build/lambda-artifacts.sha256
      - name: Verify product identity inputs
        if: env.TF_VAR_runtime_active == 'true'
        shell: bash
        env:
          HINDSIGHT_VIEWER_PASSWORD: ${{ secrets.HINDSIGHT_VIEWER_PASSWORD }}
          HINDSIGHT_OPERATOR_PASSWORD: ${{ secrets.HINDSIGHT_OPERATOR_PASSWORD }}
          VIEWER_USERNAME: ${{ vars.HINDSIGHT_VIEWER_USERNAME || 'hindsight-viewer' }}
          OPERATOR_USERNAME: ${{ vars.HINDSIGHT_OPERATOR_USERNAME || 'hindsight-operator' }}
        run: |
          validate_password() {
            local label="$1"
            local value="$2"
            if [[ ${#value} -lt 14 || ! "$value" =~ [[:lower:]] || ! "$value" =~ [[:upper:]] || ! "$value" =~ [[:digit:]] || ! "$value" =~ [^[:alnum:]] ]]; then
              echo "::error::${label} must satisfy the configured Cognito password policy"
              return 1
            fi
          }
          if [[ -z "$VIEWER_USERNAME" || -z "$OPERATOR_USERNAME" ]]; then
            echo "::error::Product identity usernames are required"
            exit 1
          fi
          if [[ "$VIEWER_USERNAME" == "$OPERATOR_USERNAME" ]]; then
            echo "::error::Viewer and operator usernames must be distinct"
            exit 1
          fi
          if [[ -z "$HINDSIGHT_VIEWER_PASSWORD" || -z "$HINDSIGHT_OPERATOR_PASSWORD" ]]; then
            echo "::error::Product identity password secrets are required"
            exit 1
          fi
          if [[ "$HINDSIGHT_VIEWER_PASSWORD" == "$HINDSIGHT_OPERATOR_PASSWORD" ]]; then
            echo "::error::Viewer and operator passwords must be distinct"
            exit 1
          fi
          validate_password "Viewer password" "$HINDSIGHT_VIEWER_PASSWORD"
          validate_password "Operator password" "$HINDSIGHT_OPERATOR_PASSWORD"
      - name: Verify durable dependencies
        run: >-
          uv run python scripts/deployment_preflight.py
          --certificate-arn "$TF_VAR_acm_certificate_arn"
          --cloudflare-zone-id "$TF_VAR_cloudflare_zone_id"
          --deploy-database-parameter "$DEPLOY_DATABASE_PARAMETER"
          --api-database-parameter "$TF_VAR_api_database_url_parameter_name"
          --worker-database-parameter "$TF_VAR_worker_database_url_parameter_name"
          --gemini-parameter "$TF_VAR_gemini_api_keys_parameter_name"
          --llm-provider "$TF_VAR_llm_provider"
          --embedding-provider "$TF_VAR_embedding_provider"
          --changefeed-parameter "$TF_VAR_changefeed_token_parameter_name"
      - name: Apply database migrations and initialize agent persistence
        shell: bash
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DEPLOY_DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          uv run python scripts/migrate.py
          uv run python scripts/initialize_agent_storage.py
          uv run python scripts/apply_database_roles.py \
            --api-parameter "$TF_VAR_api_database_url_parameter_name" \
            --worker-parameter "$TF_VAR_worker_database_url_parameter_name"
      - name: Initialize remote state
        run: >-
          terraform -chdir=infra/terraform/app init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TF_STATE_KEY"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - run: terraform -chdir=infra/terraform/app apply -input=false -auto-approve "$GITHUB_WORKSPACE/build/demo.tfplan"
      - name: Configure product identities
        if: env.TF_VAR_runtime_active == 'true'
        shell: bash
        env:
          HINDSIGHT_VIEWER_PASSWORD: ${{ secrets.HINDSIGHT_VIEWER_PASSWORD }}
          HINDSIGHT_OPERATOR_PASSWORD: ${{ secrets.HINDSIGHT_OPERATOR_PASSWORD }}
          VIEWER_USERNAME: ${{ vars.HINDSIGHT_VIEWER_USERNAME || 'hindsight-viewer' }}
          OPERATOR_USERNAME: ${{ vars.HINDSIGHT_OPERATOR_USERNAME || 'hindsight-operator' }}
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DEPLOY_DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          USER_POOL_ID="$(terraform -chdir=infra/terraform/app output -raw cognito_user_pool_id)"
          COGNITO_ISSUER="$(terraform -chdir=infra/terraform/app output -raw cognito_issuer)"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          uv run python scripts/configure_product_identities.py \
            --region "$AWS_REGION" \
            --user-pool-id "$USER_POOL_ID" \
            --issuer "$COGNITO_ISSUER" \
            --tenant-id "00000000-0000-0000-0000-000000000002" \
            --viewer-username "$VIEWER_USERNAME" \
            --operator-username "$OPERATOR_USERNAME"
      - name: Configure embedding profile
        if: env.TF_VAR_runtime_active == 'true'
        shell: bash
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DEPLOY_DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          export HINDSIGHT_DATABASE_URL_PARAM="$DEPLOY_DATABASE_PARAMETER"
          export HINDSIGHT_GEMINI_API_KEYS_PARAM="$TF_VAR_gemini_api_keys_parameter_name"
          HINDSIGHT_GEMINI_KEY_HEALTH_TABLE="$(terraform -chdir=infra/terraform/app output -raw gemini_key_health_table)"
          export HINDSIGHT_GEMINI_KEY_HEALTH_TABLE
          export LLM_PROVIDER="$TF_VAR_llm_provider"
          export EMBEDDING_PROVIDER="$TF_VAR_embedding_provider"
          export GEMINI_EMBEDDING_MODEL="$TF_VAR_gemini_embedding_model"
          export HINDSIGHT_GEMINI_REPRESENTATION="$TF_VAR_gemini_embedding_representation"
          uv run python scripts/reembed_memories.py --max-distance "$EMBEDDING_MAX_DISTANCE"
      - name: Configure changefeed
        if: inputs.health_only != true && env.TF_VAR_runtime_active == 'true'
        shell: bash
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DEPLOY_DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          CHANGEFEED_TOKEN="$(aws ssm get-parameter --name "$TF_VAR_changefeed_token_parameter_name" --with-decryption --query Parameter.Value --output text)"
          CHANGEFEED_WEBHOOK_URL="$(terraform -chdir=infra/terraform/app output -raw changefeed_webhook_url)"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$CHANGEFEED_TOKEN"
          export DATABASE_URL
          export HINDSIGHT_CHANGEFEED_AUTH_TOKEN="$CHANGEFEED_TOKEN"
          export HINDSIGHT_CHANGEFEED_WEBHOOK_URL="$CHANGEFEED_WEBHOOK_URL"
          uv run python scripts/configure_changefeed.py apply
      - name: Pause changefeed for inactive runtime
        if: env.TF_VAR_runtime_active != 'true'
        shell: bash
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DEPLOY_DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          uv run python scripts/configure_changefeed.py pause
      - name: Invalidate deployed UI
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "$(terraform -chdir=infra/terraform/app output -raw cloudfront_distribution_id)"
          --paths '/*'
      - id: stack_outputs
        name: Capture deployed endpoints
        shell: bash
        run: |
          UI_URL="$(terraform -chdir=infra/terraform/app output -raw ui_url)"
          API_URL="$(terraform -chdir=infra/terraform/app output -raw api_url)"
          WEBSOCKET_URL="$(terraform -chdir=infra/terraform/app output -raw websocket_url)"
          COGNITO_USER_POOL_ID="$(terraform -chdir=infra/terraform/app output -raw cognito_user_pool_id)"
          COGNITO_USER_POOL_CLIENT_ID="$(terraform -chdir=infra/terraform/app output -raw cognito_user_pool_client_id)"
          WORKER_TIMEOUT_SECONDS="$(terraform -chdir=infra/terraform/app output -raw worker_timeout_seconds)"
          RUN_ATTEMPT_LEASE_SECONDS="$(terraform -chdir=infra/terraform/app output -raw run_attempt_lease_seconds)"
          RUN_QUEUE_VISIBILITY_SECONDS="$(terraform -chdir=infra/terraform/app output -raw run_queue_visibility_seconds)"
          RUN_MAX_ATTEMPTS="$(terraform -chdir=infra/terraform/app output -raw run_max_attempts)"
          RUN_DISPATCH_SCHEDULE_SECONDS="$(terraform -chdir=infra/terraform/app output -raw run_dispatch_schedule_seconds)"
          {
            echo "ui_url=$UI_URL"
            echo "api_url=$API_URL"
            echo "websocket_url=$WEBSOCKET_URL"
            echo "cognito_user_pool_id=$COGNITO_USER_POOL_ID"
            echo "cognito_user_pool_client_id=$COGNITO_USER_POOL_CLIENT_ID"
            echo "worker_timeout_seconds=$WORKER_TIMEOUT_SECONDS"
            echo "run_attempt_lease_seconds=$RUN_ATTEMPT_LEASE_SECONDS"
            echo "run_queue_visibility_seconds=$RUN_QUEUE_VISIBILITY_SECONDS"
            echo "run_max_attempts=$RUN_MAX_ATTEMPTS"
            echo "run_dispatch_schedule_seconds=$RUN_DISPATCH_SCHEDULE_SECONDS"
          } >> "$GITHUB_OUTPUT"
      - name: Verify deployed HTTP health
        shell: bash
        env:
          UI_URL: ${{ steps.stack_outputs.outputs.ui_url }}
          API_URL: ${{ steps.stack_outputs.outputs.api_url }}
        run: |
          check_200() {
            local label="$1"
            local url="$2"
            local status
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "$url")" || return 1
            if [[ "$status" != "200" ]]; then
              echo "$label returned HTTP $status" >&2
              return 1
            fi
          }
          for _ in {1..12}; do
            if check_200 "UI root" "$UI_URL/" \
              && check_200 "direct API liveness" "$API_URL/v1/health/live" \
              && check_200 "direct API readiness" "$API_URL/v1/health/ready" \
              && check_200 "direct DB-backed route" "$API_URL/v1/incidents?limit=1" \
              && check_200 "UI-proxied readiness" "$UI_URL/v1/health/ready"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Verify WebSocket connect and clean close
        shell: bash
        env:
          API_URL: ${{ steps.stack_outputs.outputs.api_url }}
          WEBSOCKET_URL: ${{ steps.stack_outputs.outputs.websocket_url }}
        run: |
          for _ in {1..12}; do
            if uv run python - "$WEBSOCKET_URL" "$API_URL" <<'PY'
          import asyncio
          import json
          import sys
          from urllib import request
          from urllib.parse import urlencode

          from websockets.asyncio.client import connect


          async def verify() -> None:
              ticket_request = request.Request(
                  f"{sys.argv[2].rstrip('/')}/v1/realtime/ticket",
                  data=b"",
                  method="POST",
              )
              with request.urlopen(ticket_request, timeout=15) as response:
                  ticket = json.loads(response.read())["ticket"]
              websocket_url = f"{sys.argv[1]}?{urlencode({'ticket': ticket})}"
              async with connect(websocket_url, open_timeout=15, close_timeout=15):
                  pass


          asyncio.run(verify())
          PY
            then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Record deployment-health evidence
        env:
          DEPLOYED_SHA: ${{ needs.authorize.outputs.source_sha }}
          HEALTH_ONLY: ${{ inputs.health_only }}
          UI_URL: ${{ steps.stack_outputs.outputs.ui_url }}
          API_URL: ${{ steps.stack_outputs.outputs.api_url }}
          WEBSOCKET_URL: ${{ steps.stack_outputs.outputs.websocket_url }}
        shell: bash
        run: |
          {
            echo "### Deployment health"
            echo
            echo "Exact revision \`$DEPLOYED_SHA\` passed the deployment-health checks."
            echo
            echo "- Health-only mode: $HEALTH_ONLY"
            echo "- UI: $UI_URL"
            echo "- API: $API_URL"
            echo "- WebSocket: $WEBSOCKET_URL"
            echo "- Checks: UI root, direct API live/ready, DB-backed incident list, UI-proxied readiness, WebSocket connect/close"
          } >> "$GITHUB_STEP_SUMMARY"
