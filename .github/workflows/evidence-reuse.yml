name: migration and recovery evidence reuse

on:
  workflow_dispatch:
    inputs:
      migration_run_id:
        description: Successful exact-main migration compatibility run ID
        required: true
        type: string
      migration_run_attempt:
        description: Successful migration compatibility run attempt
        required: true
        default: "1"
        type: string
      recovery_run_id:
        description: Successful exact-main recovery drill run ID
        required: true
        type: string
      recovery_run_attempt:
        description: Successful recovery drill run attempt
        required: true
        default: "1"
        type: string

permissions: {}

concurrency:
  group: hindsight-evidence-reuse-${{ github.sha }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL }}
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.authorization.outputs.target_sha }}
      migration_run_id: ${{ steps.authorization.outputs.migration_run_id }}
      migration_run_attempt: ${{ steps.authorization.outputs.migration_run_attempt }}
      recovery_run_id: ${{ steps.authorization.outputs.recovery_run_id }}
      recovery_run_attempt: ${{ steps.authorization.outputs.recovery_run_attempt }}
    steps:
      - id: authorization
        name: Require repository owner on exact main
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          MIGRATION_RUN_ID: ${{ inputs.migration_run_id }}
          MIGRATION_RUN_ATTEMPT: ${{ inputs.migration_run_attempt }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_RUN_ATTEMPT: ${{ inputs.recovery_run_attempt }}
        shell: bash
        run: |
          [[ "$EVENT_NAME" == "workflow_dispatch" \
            && "$REF_NAME" == "refs/heads/main" \
            && "$WORKFLOW_REF" == "$REPOSITORY/.github/workflows/evidence-reuse.yml@$REF_NAME" \
            && "$ACTOR" == "$REPOSITORY_OWNER" \
            && "$TRIGGERING_ACTOR" == "$REPOSITORY_OWNER" \
            && "$EVENT_SHA" =~ ^[0-9a-f]{40}$ \
            && "$MIGRATION_RUN_ID" =~ ^[1-9][0-9]*$ \
            && "$MIGRATION_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
            && "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ \
            && "$RECOVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
            echo "Evidence reuse requires the repository owner on exact main and exact source runs." >&2
            exit 1
          }
          {
            echo "target_sha=$EVENT_SHA"
            echo "migration_run_id=$MIGRATION_RUN_ID"
            echo "migration_run_attempt=$MIGRATION_RUN_ATTEMPT"
            echo "recovery_run_id=$RECOVERY_RUN_ID"
            echo "recovery_run_attempt=$RECOVERY_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

  reuse:
    needs: authorize
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      INPUT_DIR: build/evidence-reuse-input
      OUTPUT_DIR: build/evidence-reuse
      TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
      MIGRATION_RUN_ID: ${{ needs.authorize.outputs.migration_run_id }}
      MIGRATION_RUN_ATTEMPT: ${{ needs.authorize.outputs.migration_run_attempt }}
      RECOVERY_RUN_ID: ${{ needs.authorize.outputs.recovery_run_id }}
      RECOVERY_RUN_ATTEMPT: ${{ needs.authorize.outputs.recovery_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact target revision
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Fetch exact source run and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$INPUT_DIR"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$MIGRATION_RUN_ID/attempts/$MIGRATION_RUN_ATTEMPT" \
            > "$INPUT_DIR/migration-run.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$MIGRATION_RUN_ID/artifacts?per_page=100" \
            > "$INPUT_DIR/migration-artifacts.json"
          migration_name="migration-compatibility-${MIGRATION_RUN_ID}-${MIGRATION_RUN_ATTEMPT}"
          migration_artifact_id="$(jq -er --arg name "$migration_name" \
            '[.artifacts[] | select(.name == $name)] | if length == 1 then .[0].id else error("artifact identity is absent or ambiguous") end' \
            "$INPUT_DIR/migration-artifacts.json")"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$migration_artifact_id/zip" \
            > "$INPUT_DIR/migration.zip"

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID/attempts/$RECOVERY_RUN_ATTEMPT" \
            > "$INPUT_DIR/recovery-run.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID/artifacts?per_page=100" \
            > "$INPUT_DIR/recovery-artifacts.json"
          recovery_name="recovery-drill-${RECOVERY_RUN_ID}-${RECOVERY_RUN_ATTEMPT}"
          recovery_artifact_id="$(jq -er --arg name "$recovery_name" \
            '[.artifacts[] | select(.name == $name)] | if length == 1 then .[0].id else error("artifact identity is absent or ambiguous") end' \
            "$INPUT_DIR/recovery-artifacts.json")"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$recovery_artifact_id/zip" \
            > "$INPUT_DIR/recovery.zip"
      - name: Verify and bind docs-only evidence reuse
        run: >-
          python3 scripts/evidence_reuse.py reuse
          --repository "$GITHUB_REPOSITORY"
          --target-revision "$TARGET_SHA"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --actor "$GITHUB_ACTOR"
          --triggering-actor "$GITHUB_TRIGGERING_ACTOR"
          --event-name "$GITHUB_EVENT_NAME"
          --ref-name "$GITHUB_REF"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
          --migration-run-id "$MIGRATION_RUN_ID"
          --migration-run-attempt "$MIGRATION_RUN_ATTEMPT"
          --migration-run-metadata "$INPUT_DIR/migration-run.json"
          --migration-artifact-metadata "$INPUT_DIR/migration-artifacts.json"
          --migration-archive "$INPUT_DIR/migration.zip"
          --recovery-run-id "$RECOVERY_RUN_ID"
          --recovery-run-attempt "$RECOVERY_RUN_ATTEMPT"
          --recovery-run-metadata "$INPUT_DIR/recovery-run.json"
          --recovery-artifact-metadata "$INPUT_DIR/recovery-artifacts.json"
          --recovery-archive "$INPUT_DIR/recovery.zip"
          --output-dir "$OUTPUT_DIR"
      - name: Upload evidence reuse receipt
        uses: actions/upload-artifact@v4
        with:
          name: evidence-reuse-${{ needs.authorize.outputs.target_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 30
