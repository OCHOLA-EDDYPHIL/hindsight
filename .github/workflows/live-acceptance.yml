name: live acceptance

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled

permissions: {}

concurrency:
  group: hindsight-demo-environment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  GEMINI_PARAMETER: ${{ vars.HINDSIGHT_GEMINI_API_KEYS_PARAM || '/hindsight/demo/gemini-api-keys' }}
  DATABASE_PARAMETER: ${{ vars.HINDSIGHT_DATABASE_URL_PARAM || '/hindsight/demo/database-url' }}
  OPERATOR_PARAMETER: ${{ vars.HINDSIGHT_OPERATOR_TOKEN_PARAM || '/hindsight/demo/operator-token' }}
  CHANGEFEED_PARAMETER: ${{ vars.HINDSIGHT_CHANGEFEED_TOKEN_PARAM || '/hindsight/demo/changefeed-token' }}
  GEMINI_MODEL: ${{ vars.HINDSIGHT_GEMINI_MODEL || 'gemini-2.5-flash' }}
  GEMINI_EMBEDDING_MODEL: ${{ vars.HINDSIGHT_GEMINI_EMBEDDING_MODEL || 'gemini-embedding-2' }}
  BENCHMARK_MAX_DISTANCE: "0.35"

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
      acceptance_sha: ${{ steps.authorization.outputs.acceptance_sha }}
    steps:
      - id: authorization
        name: Resolve owner-authorized acceptance revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          LABEL_NAME: ${{ github.event.label.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REF_NAME" == "refs/heads/main" \
              && "$WORKFLOW_REF" == "$REPOSITORY/.github/workflows/live-acceptance.yml@$REF_NAME" \
              && "$ACTOR" == "$REPOSITORY_OWNER" \
              && "$TRIGGERING_ACTOR" == "$REPOSITORY_OWNER" ]] || {
              echo "Manual live acceptance requires the repository owner on main." >&2
              exit 1
            }
            ACCEPTANCE_SHA="$EVENT_SHA"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$LABEL_NAME" == "live-acceptance" \
              && "$HEAD_REPOSITORY" == "$REPOSITORY" \
              && "$WORKFLOW_REF" == "$REPOSITORY/.github/workflows/live-acceptance.yml@$REF_NAME" \
              && "$ACTOR" == "$REPOSITORY_OWNER" \
              && "$TRIGGERING_ACTOR" == "$REPOSITORY_OWNER" ]] || {
              echo "PR live acceptance requires the repository owner to apply the live-acceptance label to a same-repository PR." >&2
              exit 1
            }
            ACCEPTANCE_SHA="$HEAD_SHA"
          else
            echo "Unsupported live-acceptance event: $EVENT_NAME" >&2
            exit 1
          fi
          [[ "$ACCEPTANCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Live acceptance did not resolve a commit SHA." >&2
            exit 1
          }
          echo "authorized=true" >> "$GITHUB_OUTPUT"
          echo "acceptance_sha=$ACCEPTANCE_SHA" >> "$GITHUB_OUTPUT"

  verify:
    needs: authorize
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: postgresql://root@localhost:26257/hindsight_live_ci_${{ github.run_id }}?sslmode=disable
      EMBEDDING_PROVIDER: deterministic
      LLM_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.acceptance_sha }}
          persist-credentials: false
      - name: Verify exact acceptance revision
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.acceptance_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Start isolated CockroachDB
        run: docker compose up -d crdb
      - name: Apply migrations
        shell: bash
        run: |
          for _ in {1..30}; do
            if docker compose exec -T crdb cockroach sql --insecure -e 'SELECT 1'; then
              break
            fi
            sleep 1
          done
          docker compose exec -T crdb cockroach sql --insecure \
            -e 'CREATE DATABASE IF NOT EXISTS hindsight_live_ci_${{ github.run_id }}'
          docker compose exec -T crdb cockroach sql --insecure \
            -e 'SET CLUSTER SETTING feature.vector_index.enabled = true'
          uv run python scripts/migrate.py
      - name: Run normal checks
        shell: bash
        run: |
          uv run ruff check .
          uv run pytest -q
          uv run python scripts/run_learning_benchmark.py ci-smoke
          node --input-type=module --check < src/hindsight/web/app.js
      - uses: hashicorp/setup-terraform@v3
      - name: Validate Terraform
        shell: bash
        run: |
          terraform fmt -check -recursive infra/terraform
          terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infra/terraform/bootstrap validate
          terraform -chdir=infra/terraform/bootstrap test
          terraform -chdir=infra/terraform/app init -backend=false -input=false
          terraform -chdir=infra/terraform/app validate
          terraform -chdir=infra/terraform/app test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load and mask Gemini credentials from SSM
        shell: bash
        run: |
          GEMINI_MATERIAL="$(aws ssm get-parameter --name "$GEMINI_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          [[ -n "$GEMINI_MATERIAL" && "$GEMINI_MATERIAL" != "None" ]] || {
            echo "Gemini credential material is unavailable." >&2
            exit 1
          }
          echo "::add-mask::$GEMINI_MATERIAL"
          FIRST_GEMINI_KEY=""
          while IFS= read -r api_key; do
            [[ -n "$api_key" ]] || continue
            echo "::add-mask::$api_key"
            if [[ -z "$FIRST_GEMINI_KEY" ]]; then
              FIRST_GEMINI_KEY="$api_key"
            fi
          done < <(
            GEMINI_API_KEYS="$GEMINI_MATERIAL" uv run python -c \
              'from hindsight.gemini import parse_gemini_credentials; import os; [print(item.api_key) for item in parse_gemini_credentials(os.environ)]'
          )
          [[ -n "$FIRST_GEMINI_KEY" ]] || {
            echo "Gemini credential document contains no usable key." >&2
            exit 1
          }
          delimiter="HINDSIGHT_GEMINI_KEYS_${GITHUB_RUN_ID}_${RANDOM}"
          {
            echo "GEMINI_API_KEYS<<$delimiter"
            printf '%s\n' "$GEMINI_MATERIAL"
            echo "$delimiter"
            printf 'GEMINI_API_KEY=%s\n' "$FIRST_GEMINI_KEY"
          } >> "$GITHUB_ENV"
      - name: Invoke live Gemini providers
        env:
          RUN_LIVE_GEMINI_EMBEDDINGS: "1"
          RUN_LIVE_GEMINI_REASONING: "1"
        run: >-
          uv run pytest -q
          tests/test_embeddings.py::test_live_gemini_embedding_provider_ranks_low_overlap_paraphrase
          tests/test_reasoning.py::test_live_gemini_reasoning_provider

  deploy:
    needs:
      - authorize
      - verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-demo.yml
    secrets: inherit
    with:
      apply: true
      validation_mode: true
      embedding_max_distance: "0.35"
      source_sha: ${{ needs.authorize.outputs.acceptance_sha }}

  semantic_acceptance:
    needs:
      - authorize
      - deploy
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      EMBEDDING_PROVIDER: gemini
      LLM_PROVIDER: gemini
      RUN_LIVE_GEMINI_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.acceptance_sha }}
          persist-credentials: false
      - name: Verify exact acceptance revision
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.acceptance_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load and mask hosted validation settings from SSM
        shell: bash
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          GEMINI_MATERIAL="$(aws ssm get-parameter --name "$GEMINI_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          [[ -n "$DATABASE_URL" && "$DATABASE_URL" != "None" ]] || {
            echo "Hosted database URL is unavailable." >&2
            exit 1
          }
          [[ -n "$GEMINI_MATERIAL" && "$GEMINI_MATERIAL" != "None" ]] || {
            echo "Gemini credential material is unavailable." >&2
            exit 1
          }
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$GEMINI_MATERIAL"
          while IFS= read -r api_key; do
            [[ -n "$api_key" ]] && echo "::add-mask::$api_key"
          done < <(
            GEMINI_API_KEYS="$GEMINI_MATERIAL" uv run python -c \
              'from hindsight.gemini import parse_gemini_credentials; import os; [print(item.api_key) for item in parse_gemini_credentials(os.environ)]'
          )
          delimiter="HINDSIGHT_GEMINI_KEYS_${GITHUB_RUN_ID}_${RANDOM}"
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            echo "GEMINI_API_KEYS<<$delimiter"
            printf '%s\n' "$GEMINI_MATERIAL"
            echo "$delimiter"
          } >> "$GITHUB_ENV"
      - name: Verify live semantic retrieval and frozen cutoff
        run: >-
          uv run pytest -q
          tests/test_live_semantic_acceptance.py::test_live_gemini_database_retrieval_discriminates_paraphrase_and_no_match
          tests/test_live_semantic_acceptance.py::test_live_gemini_cutoff_generalizes_across_calibration_mechanisms
      - name: Record semantic acceptance evidence
        env:
          HEAD_SHA: ${{ needs.authorize.outputs.acceptance_sha }}
        run: |
          {
            echo "### Live semantic acceptance"
            echo
            echo "Gemini semantic retrieval and the independent cutoff checks succeeded at \`$HEAD_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

  benchmark:
    needs:
      - authorize
      - deploy
      - semantic_acceptance
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    env:
      EMBEDDING_PROVIDER: gemini
      LLM_PROVIDER: gemini
      HINDSIGHT_BENCHMARK_CODE_SHA: ${{ needs.authorize.outputs.acceptance_sha }}
      HINDSIGHT_CHANGEFEED_WEBHOOK_URL: ${{ needs.deploy.outputs.api_url }}/internal/changefeed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.acceptance_sha }}
          persist-credentials: false
      - name: Verify exact acceptance revision
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.acceptance_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load and mask benchmark settings from SSM
        shell: bash
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          GEMINI_MATERIAL="$(aws ssm get-parameter --name "$GEMINI_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          CHANGEFEED_TOKEN="$(aws ssm get-parameter --name "$CHANGEFEED_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          [[ -n "$DATABASE_URL" && "$DATABASE_URL" != "None" ]] || {
            echo "Hosted database URL is unavailable." >&2
            exit 1
          }
          [[ -n "$GEMINI_MATERIAL" && "$GEMINI_MATERIAL" != "None" ]] || {
            echo "Gemini credential material is unavailable." >&2
            exit 1
          }
          [[ -n "$CHANGEFEED_TOKEN" && "$CHANGEFEED_TOKEN" != "None" ]] || {
            echo "Changefeed credential material is unavailable." >&2
            exit 1
          }
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$GEMINI_MATERIAL"
          echo "::add-mask::$CHANGEFEED_TOKEN"
          while IFS= read -r api_key; do
            [[ -n "$api_key" ]] && echo "::add-mask::$api_key"
          done < <(
            GEMINI_API_KEYS="$GEMINI_MATERIAL" uv run python -c \
              'from hindsight.gemini import parse_gemini_credentials; import os; [print(item.api_key) for item in parse_gemini_credentials(os.environ)]'
          )
          delimiter="HINDSIGHT_GEMINI_KEYS_${GITHUB_RUN_ID}_${RANDOM}"
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            echo "GEMINI_API_KEYS<<$delimiter"
            printf '%s\n' "$GEMINI_MATERIAL"
            echo "$delimiter"
            printf 'HINDSIGHT_CHANGEFEED_AUTH_TOKEN=%s\n' "$CHANGEFEED_TOKEN"
          } >> "$GITHUB_ENV"
      - id: pause_changefeed
        name: Pause and fence the managed changefeed for benchmark isolation
        run: uv run python scripts/configure_changefeed.py pause
      - name: Run frozen pilot
        id: pilot
        shell: bash
        run: |
          mkdir -p live-acceptance-reports
          uv run python scripts/run_learning_benchmark.py pilot \
            --repetitions 2 \
            --max-distance "$BENCHMARK_MAX_DISTANCE" \
            > live-acceptance-reports/pilot.json
          PILOT_EXPERIMENT_ID="$(
            uv run python - live-acceptance-reports/pilot.json <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(report["experiment_id"])
          PY
          )"
          [[ -n "$PILOT_EXPERIMENT_ID" ]] || exit 1
          echo "experiment_id=$PILOT_EXPERIMENT_ID" >> "$GITHUB_OUTPUT"
      - name: Persist confirmation preregistration
        run: >-
          uv run python scripts/run_learning_benchmark.py preregister
          --pilot-experiment-id "${{ steps.pilot.outputs.experiment_id }}"
          > live-acceptance-reports/preregistration.json
      - name: Run preregistered confirmation
        run: >-
          uv run python scripts/run_learning_benchmark.py confirmation
          --pilot-experiment-id "${{ steps.pilot.outputs.experiment_id }}"
          > live-acceptance-reports/confirmation.json
      - name: Require every confirmation gate
        shell: bash
        run: |
          uv run python - live-acceptance-reports/confirmation.json "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          gates = report.get("gates") or {}
          lines = [
              "### Preregistered live benchmark",
              "",
              f"- Experiment: `{report.get('experiment_id')}`",
              f"- Trace digest: `{report.get('raw_trace_digest')}`",
              f"- Claim authorized: `{report.get('claim_authorized') is True}`",
              "",
              "| Gate | Result |",
              "| --- | --- |",
          ]
          lines.extend(
              f"| {name} | {'pass' if value is True else 'fail'} |"
              for name, value in sorted(gates.items())
          )
          with pathlib.Path(sys.argv[2]).open("a") as summary:
              summary.write("\n".join(lines) + "\n")
          if report.get("claim_authorized") is not True or not gates or not all(
              value is True for value in gates.values()
          ):
              raise SystemExit("confirmation did not authorize the semantic-learning claim")
          PY
      - name: Preserve non-secret benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-benchmark-${{ needs.authorize.outputs.acceptance_sha }}-${{ github.run_attempt }}
          path: live-acceptance-reports/*.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Resume and verify the managed changefeed
        if: always() && steps.pause_changefeed.outcome == 'success'
        shell: bash
        run: |
          uv run python scripts/configure_changefeed.py apply
          uv run python scripts/configure_changefeed.py status

  restore_changefeed:
    if: always() && needs.deploy.result == 'success'
    needs:
      - authorize
      - deploy
      - benchmark
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      HINDSIGHT_BENCHMARK_CODE_SHA: ${{ needs.authorize.outputs.acceptance_sha }}
      HINDSIGHT_CHANGEFEED_WEBHOOK_URL: ${{ needs.deploy.outputs.api_url }}/internal/changefeed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.acceptance_sha }}
          persist-credentials: false
      - name: Verify exact acceptance revision
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.acceptance_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load managed changefeed settings from SSM
        shell: bash
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          CHANGEFEED_TOKEN="$(aws ssm get-parameter --name "$CHANGEFEED_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          [[ -n "$DATABASE_URL" && "$DATABASE_URL" != "None" ]]
          [[ -n "$CHANGEFEED_TOKEN" && "$CHANGEFEED_TOKEN" != "None" ]]
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$CHANGEFEED_TOKEN"
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'HINDSIGHT_CHANGEFEED_AUTH_TOKEN=%s\n' "$CHANGEFEED_TOKEN"
          } >> "$GITHUB_ENV"
      - name: Finalize benchmark traces left by an interrupted runner
        if: needs.benchmark.result != 'success'
        env:
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        run: >-
          uv run python scripts/run_learning_benchmark.py finalize-interrupted
          --code-sha "$HINDSIGHT_BENCHMARK_CODE_SHA"
          --reason "GitHub Actions benchmark job ended with result: $BENCHMARK_RESULT"
      - name: Restore and verify the managed changefeed
        if: always()
        shell: bash
        run: |
          uv run python scripts/configure_changefeed.py apply
          uv run python scripts/configure_changefeed.py status

  browser_acceptance:
    needs:
      - authorize
      - deploy
      - benchmark
      - restore_changefeed
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      HINDSIGHT_BROWSER_BASE_URL: ${{ needs.deploy.outputs.ui_url }}
      HOSTED_API_URL: ${{ needs.deploy.outputs.api_url }}
      HINDSIGHT_WEBSOCKET_URL: ${{ needs.deploy.outputs.websocket_url }}
      EMBEDDING_PROVIDER: gemini
      LLM_PROVIDER: gemini
      RUN_HOSTED_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.acceptance_sha }}
          persist-credentials: false
      - name: Verify exact acceptance revision
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.acceptance_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load and mask hosted browser settings from SSM
        shell: bash
        run: |
          OPERATOR_TOKEN="$(aws ssm get-parameter --name "$OPERATOR_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          DATABASE_URL="$(aws ssm get-parameter --name "$DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          GEMINI_MATERIAL="$(aws ssm get-parameter --name "$GEMINI_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          CHANGEFEED_TOKEN="$(aws ssm get-parameter --name "$CHANGEFEED_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          [[ -n "$OPERATOR_TOKEN" && "$OPERATOR_TOKEN" != "None" ]] || {
            echo "Hosted operator token is unavailable." >&2
            exit 1
          }
          [[ -n "$DATABASE_URL" && "$DATABASE_URL" != "None" ]] || {
            echo "Hosted database URL is unavailable." >&2
            exit 1
          }
          [[ -n "$GEMINI_MATERIAL" && "$GEMINI_MATERIAL" != "None" ]] || {
            echo "Gemini credential material is unavailable." >&2
            exit 1
          }
          [[ -n "$CHANGEFEED_TOKEN" && "$CHANGEFEED_TOKEN" != "None" ]] || {
            echo "Hosted changefeed token is unavailable." >&2
            exit 1
          }
          echo "::add-mask::$OPERATOR_TOKEN"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$GEMINI_MATERIAL"
          echo "::add-mask::$CHANGEFEED_TOKEN"
          while IFS= read -r api_key; do
            [[ -n "$api_key" ]] && echo "::add-mask::$api_key"
          done < <(
            GEMINI_API_KEYS="$GEMINI_MATERIAL" uv run python -c \
              'from hindsight.gemini import parse_gemini_credentials; import os; [print(item.api_key) for item in parse_gemini_credentials(os.environ)]'
          )
          delimiter="HINDSIGHT_GEMINI_KEYS_${GITHUB_RUN_ID}_${RANDOM}"
          {
            printf 'HINDSIGHT_BROWSER_OPERATOR_TOKEN=%s\n' "$OPERATOR_TOKEN"
            printf 'HINDSIGHT_CHANGEFEED_AUTH_TOKEN=%s\n' "$CHANGEFEED_TOKEN"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            echo "GEMINI_API_KEYS<<$delimiter"
            printf '%s\n' "$GEMINI_MATERIAL"
            echo "$delimiter"
          } >> "$GITHUB_ENV"
      - name: Verify deployed endpoints
        shell: bash
        run: |
          [[ "$HINDSIGHT_BROWSER_BASE_URL" == https://* ]]
          [[ "$HOSTED_API_URL" == https://* ]]
          [[ "$HINDSIGHT_WEBSOCKET_URL" == wss://* ]]
          curl --fail --silent --show-error "$HINDSIGHT_BROWSER_BASE_URL/v1/health/ready"
          curl --fail --silent --show-error "$HOSTED_API_URL/v1/health/ready"
      - name: Run hosted changefeed, WebSocket, worker, and Firefox acceptance
        run: uv run pytest -q tests/test_hosted_acceptance.py tests/test_browser_ui.py
      - name: Record browser acceptance evidence
        env:
          HEAD_SHA: ${{ needs.authorize.outputs.acceptance_sha }}
        run: |
          {
            echo "### Hosted browser acceptance"
            echo
            echo "The deployed changefeed, WebSocket reconnect/resubscribe/unsubscribe, worker, typed reflection, governance history, and Firefox workflow completed at \`$HEAD_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

  acceptance_complete:
    if: always()
    needs:
      - authorize
      - verify
      - deploy
      - semantic_acceptance
      - benchmark
      - restore_changefeed
      - browser_acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record acceptance evidence
        env:
          HEAD_SHA: ${{ needs.authorize.outputs.acceptance_sha }}
          UI_URL: ${{ needs.deploy.outputs.ui_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}
          AUTHORIZED: ${{ needs.authorize.outputs.authorized }}
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SEMANTIC_RESULT: ${{ needs.semantic_acceptance.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          CHANGEFEED_RESULT: ${{ needs.restore_changefeed.result }}
          BROWSER_RESULT: ${{ needs.browser_acceptance.result }}
        shell: bash
        run: |
          [[ "$AUTHORIZED" == "true" ]]
          for result in \
            "$AUTHORIZE_RESULT" \
            "$VERIFY_RESULT" \
            "$DEPLOY_RESULT" \
            "$SEMANTIC_RESULT" \
            "$BENCHMARK_RESULT" \
            "$CHANGEFEED_RESULT" \
            "$BROWSER_RESULT"; do
            [[ "$result" == "success" ]] || {
              echo "A required live-acceptance job did not succeed: $result" >&2
              exit 1
            }
          done
          [[ "$UI_URL" == https://* && "$API_URL" == https://* ]]
          {
            echo "### Live acceptance complete"
            echo
            echo "All live gates succeeded for \`$HEAD_SHA\`."
            echo
            echo "- UI: $UI_URL"
            echo "- API: $API_URL"
          } >> "$GITHUB_STEP_SUMMARY"
