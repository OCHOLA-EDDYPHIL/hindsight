name: live acceptance

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: hindsight-demo-environment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  GEMINI_PARAMETER: ${{ vars.HINDSIGHT_GEMINI_API_KEYS_PARAM || '/hindsight/demo/gemini-api-keys' }}
  DEPLOY_DATABASE_PARAMETER: ${{ vars.HINDSIGHT_DEPLOY_DATABASE_URL_PARAM || '/hindsight/demo/database-url' }}
  OPERATOR_PARAMETER: ${{ vars.HINDSIGHT_OPERATOR_TOKEN_PARAM || '/hindsight/demo/operator-token' }}
  CHANGEFEED_PARAMETER: ${{ vars.HINDSIGHT_CHANGEFEED_TOKEN_PARAM || '/hindsight/demo/changefeed-token' }}
  GEMINI_MODEL: ${{ vars.HINDSIGHT_GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
  GEMINI_EMBEDDING_MODEL: ${{ vars.HINDSIGHT_GEMINI_EMBEDDING_MODEL || 'gemini-embedding-2' }}

jobs:
  authorize:
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
      product_sha: ${{ steps.authorization.outputs.product_sha }}
    steps:
      - id: authorization
        name: Resolve owner-authorized product revision
        env:
          REF_NAME: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          [[ "$REF_NAME" == "refs/heads/main" \
            && "$WORKFLOW_REF" == "$REPOSITORY/.github/workflows/live-acceptance.yml@$REF_NAME" \
            && "$ACTOR" == "$REPOSITORY_OWNER" \
            && "$TRIGGERING_ACTOR" == "$REPOSITORY_OWNER" \
            && "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Product acceptance requires the repository owner on exact main." >&2
            exit 1
          }
          {
            echo "authorized=true"
            echo "product_sha=$EVENT_SHA"
          } >> "$GITHUB_OUTPUT"

  exact_main_ci:
    needs: authorize
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
    outputs:
      ci_run_id: ${{ steps.provenance.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.provenance.outputs.ci_run_attempt }}
      ci_run_url: ${{ steps.provenance.outputs.ci_run_url }}
      ci_workflow_path: ${{ steps.provenance.outputs.ci_workflow_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.product_sha }}
          persist-credentials: false
      - name: Verify exact product revision
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.product_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - id: provenance
        name: Require unique successful exact-main CI
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_SHA: ${{ needs.authorize.outputs.product_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh api --method GET \
            "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$PRODUCT_SHA" \
            -f per_page=100 \
            > "$RUNNER_TEMP/exact-main-ci.json"
          python scripts/verify_ci_provenance.py \
            --repository "$REPOSITORY" \
            --sha "$PRODUCT_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            < "$RUNNER_TEMP/exact-main-ci.json"

  product_preflight:
    needs:
      - authorize
      - exact_main_ci
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: demo
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: postgresql://root@localhost:26257/hindsight_product_${{ github.run_id }}?sslmode=disable
      EMBEDDING_PROVIDER: deterministic
      LLM_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.product_sha }}
          persist-credentials: false
      - name: Verify exact product revision
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.product_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Start isolated CockroachDB
        run: docker compose up -d crdb
      - name: Apply migrations and initialize persistence
        shell: bash
        run: |
          for _ in {1..30}; do
            if docker compose exec -T crdb cockroach sql --insecure -e 'SELECT 1'; then
              break
            fi
            sleep 1
          done
          docker compose exec -T crdb cockroach sql --insecure \
            -e 'SET CLUSTER SETTING feature.vector_index.enabled = true'
          uv run python scripts/migrate.py
          uv run python scripts/initialize_agent_storage.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load and mask Gemini credentials from SSM
        shell: bash
        run: |
          GEMINI_MATERIAL="$(aws ssm get-parameter --name "$GEMINI_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          [[ -n "$GEMINI_MATERIAL" && "$GEMINI_MATERIAL" != "None" ]] || exit 1
          echo "::add-mask::$GEMINI_MATERIAL"
          FIRST_GEMINI_KEY=""
          while IFS= read -r api_key; do
            [[ -n "$api_key" ]] || continue
            echo "::add-mask::$api_key"
            [[ -n "$FIRST_GEMINI_KEY" ]] || FIRST_GEMINI_KEY="$api_key"
          done < <(
            GEMINI_API_KEYS="$GEMINI_MATERIAL" uv run python -c \
              'from hindsight.gemini import parse_gemini_credentials; import os; [print(item.api_key) for item in parse_gemini_credentials(os.environ)]'
          )
          [[ -n "$FIRST_GEMINI_KEY" ]] || exit 1
          delimiter="HINDSIGHT_GEMINI_KEYS_${GITHUB_RUN_ID}_${RANDOM}"
          {
            echo "GEMINI_API_KEYS<<$delimiter"
            printf '%s\n' "$GEMINI_MATERIAL"
            echo "$delimiter"
            printf 'GEMINI_API_KEY=%s\n' "$FIRST_GEMINI_KEY"
          } >> "$GITHUB_ENV"
      - name: Verify product providers
        run: uv run python scripts/run_live_acceptance.py hosted-product --phase providers

  deploy:
    needs:
      - authorize
      - exact_main_ci
      - product_preflight
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-demo.yml
    secrets: inherit
    with:
      apply: true
      validation_mode: true
      embedding_max_distance: "0.35"
      source_sha: ${{ needs.authorize.outputs.product_sha }}

  semantic_product:
    needs: [authorize, deploy]
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: demo
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      EMBEDDING_PROVIDER: gemini
      LLM_PROVIDER: gemini
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.product_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load semantic settings
        shell: bash
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DEPLOY_DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          GEMINI_MATERIAL="$(aws ssm get-parameter --name "$GEMINI_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          for value in "$DATABASE_URL" "$GEMINI_MATERIAL"; do
            [[ -n "$value" && "$value" != "None" ]] || exit 1
            echo "::add-mask::$value"
          done
          while IFS= read -r api_key; do [[ -n "$api_key" ]] && echo "::add-mask::$api_key"; done < <(
            GEMINI_API_KEYS="$GEMINI_MATERIAL" uv run python -c \
              'from hindsight.gemini import parse_gemini_credentials; import os; [print(item.api_key) for item in parse_gemini_credentials(os.environ)]'
          )
          delimiter="HINDSIGHT_GEMINI_KEYS_${GITHUB_RUN_ID}_${RANDOM}"
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            echo "GEMINI_API_KEYS<<$delimiter"
            printf '%s\n' "$GEMINI_MATERIAL"
            echo "$delimiter"
          } >> "$GITHUB_ENV"
      - run: uv run python scripts/run_live_acceptance.py hosted-product --phase semantic

  consolidation_product:
    needs: [authorize, deploy]
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: demo
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      HOSTED_API_URL: ${{ needs.deploy.outputs.api_url }}
      EMBEDDING_PROVIDER: gemini
      LLM_PROVIDER: gemini
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.product_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load consolidation settings
        shell: bash
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DEPLOY_DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          GEMINI_MATERIAL="$(aws ssm get-parameter --name "$GEMINI_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          OPERATOR_TOKEN="$(aws ssm get-parameter --name "$OPERATOR_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          for value in "$DATABASE_URL" "$GEMINI_MATERIAL" "$OPERATOR_TOKEN"; do
            [[ -n "$value" && "$value" != "None" ]] || exit 1
            echo "::add-mask::$value"
          done
          while IFS= read -r api_key; do [[ -n "$api_key" ]] && echo "::add-mask::$api_key"; done < <(
            GEMINI_API_KEYS="$GEMINI_MATERIAL" uv run python -c \
              'from hindsight.gemini import parse_gemini_credentials; import os; [print(item.api_key) for item in parse_gemini_credentials(os.environ)]'
          )
          delimiter="HINDSIGHT_GEMINI_KEYS_${GITHUB_RUN_ID}_${RANDOM}"
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'HINDSIGHT_BROWSER_OPERATOR_TOKEN=%s\n' "$OPERATOR_TOKEN"
            echo "GEMINI_API_KEYS<<$delimiter"
            printf '%s\n' "$GEMINI_MATERIAL"
            echo "$delimiter"
          } >> "$GITHUB_ENV"
      - run: uv run python scripts/run_live_acceptance.py hosted-product --phase consolidation

  worker_product:
    needs: [authorize, deploy]
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: demo
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      HINDSIGHT_ACCEPTANCE_RUN_ATTEMPT_LEASE_SECONDS: ${{ needs.deploy.outputs.run_attempt_lease_seconds }}
      HINDSIGHT_ACCEPTANCE_QUEUE_VISIBILITY_SECONDS: ${{ needs.deploy.outputs.run_queue_visibility_seconds }}
      HINDSIGHT_ACCEPTANCE_RUN_MAX_ATTEMPTS: ${{ needs.deploy.outputs.run_max_attempts }}
      HINDSIGHT_ACCEPTANCE_SCHEDULER_SECONDS: ${{ needs.deploy.outputs.run_dispatch_schedule_seconds }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.product_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load worker database setting
        shell: bash
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DEPLOY_DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          [[ -n "$DATABASE_URL" && "$DATABASE_URL" != "None" ]] || exit 1
          echo "::add-mask::$DATABASE_URL"
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" >> "$GITHUB_ENV"
      - run: uv run python scripts/run_live_acceptance.py hosted-product --phase worker

  browser_product:
    needs: [authorize, deploy]
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: demo
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      HINDSIGHT_BROWSER_BASE_URL: ${{ needs.deploy.outputs.ui_url }}
      HOSTED_API_URL: ${{ needs.deploy.outputs.api_url }}
      HINDSIGHT_WEBSOCKET_URL: ${{ needs.deploy.outputs.websocket_url }}
      EMBEDDING_PROVIDER: gemini
      LLM_PROVIDER: gemini
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.product_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load browser settings
        shell: bash
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DEPLOY_DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          GEMINI_MATERIAL="$(aws ssm get-parameter --name "$GEMINI_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          OPERATOR_TOKEN="$(aws ssm get-parameter --name "$OPERATOR_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          CHANGEFEED_TOKEN="$(aws ssm get-parameter --name "$CHANGEFEED_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          for value in "$DATABASE_URL" "$GEMINI_MATERIAL" "$OPERATOR_TOKEN" "$CHANGEFEED_TOKEN"; do
            [[ -n "$value" && "$value" != "None" ]] || exit 1
            echo "::add-mask::$value"
          done
          while IFS= read -r api_key; do [[ -n "$api_key" ]] && echo "::add-mask::$api_key"; done < <(
            GEMINI_API_KEYS="$GEMINI_MATERIAL" uv run python -c \
              'from hindsight.gemini import parse_gemini_credentials; import os; [print(item.api_key) for item in parse_gemini_credentials(os.environ)]'
          )
          delimiter="HINDSIGHT_GEMINI_KEYS_${GITHUB_RUN_ID}_${RANDOM}"
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'HINDSIGHT_BROWSER_OPERATOR_TOKEN=%s\n' "$OPERATOR_TOKEN"
            printf 'HINDSIGHT_CHANGEFEED_AUTH_TOKEN=%s\n' "$CHANGEFEED_TOKEN"
            echo "GEMINI_API_KEYS<<$delimiter"
            printf '%s\n' "$GEMINI_MATERIAL"
            echo "$delimiter"
          } >> "$GITHUB_ENV"
      - name: Configure browser evidence directory
        run: echo "HINDSIGHT_ACCEPTANCE_ARTIFACT_DIR=$RUNNER_TEMP/hindsight-browser-evidence" >> "$GITHUB_ENV"
      - run: uv run python scripts/run_live_acceptance.py hosted-product --phase browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ needs.authorize.outputs.product_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hindsight-browser-evidence
          if-no-files-found: error
          retention-days: 90

  database_roles:
    needs: [authorize, deploy]
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: demo
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      HINDSIGHT_DEPLOY_DATABASE_URL_PARAM: ${{ vars.HINDSIGHT_DEPLOY_DATABASE_URL_PARAM || '/hindsight/demo/database-url' }}
      HINDSIGHT_API_DATABASE_URL_PARAM: ${{ vars.HINDSIGHT_API_DATABASE_URL_PARAM || '/hindsight/demo/api-database-url' }}
      HINDSIGHT_WORKER_DATABASE_URL_PARAM: ${{ vars.HINDSIGHT_WORKER_DATABASE_URL_PARAM || '/hindsight/demo/worker-database-url' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.product_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: uv run python scripts/run_live_acceptance.py hosted-product --phase roles

  product_acceptance_complete:
    if: always()
    needs:
      - authorize
      - exact_main_ci
      - product_preflight
      - deploy
      - semantic_product
      - consolidation_product
      - worker_product
      - browser_product
      - database_roles
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Require every product gate
        env:
          HEAD_SHA: ${{ needs.authorize.outputs.product_sha }}
          UI_URL: ${{ needs.deploy.outputs.ui_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}
          AUTHORIZED: ${{ needs.authorize.outputs.authorized }}
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          EXACT_MAIN_CI_RESULT: ${{ needs.exact_main_ci.result }}
          PREFLIGHT_RESULT: ${{ needs.product_preflight.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SEMANTIC_RESULT: ${{ needs.semantic_product.result }}
          CONSOLIDATION_RESULT: ${{ needs.consolidation_product.result }}
          WORKER_RESULT: ${{ needs.worker_product.result }}
          BROWSER_RESULT: ${{ needs.browser_product.result }}
          DATABASE_ROLES_RESULT: ${{ needs.database_roles.result }}
        shell: bash
        run: |
          [[ "$AUTHORIZED" == "true" ]]
          for result in \
            "$AUTHORIZE_RESULT" \
            "$EXACT_MAIN_CI_RESULT" \
            "$PREFLIGHT_RESULT" \
            "$DEPLOY_RESULT" \
            "$SEMANTIC_RESULT" \
            "$CONSOLIDATION_RESULT" \
            "$WORKER_RESULT" \
            "$BROWSER_RESULT" \
            "$DATABASE_ROLES_RESULT"; do
            [[ "$result" == "success" ]] || {
              echo "A required product-acceptance job did not succeed: $result" >&2
              exit 1
            }
          done
          [[ "$UI_URL" == https://* && "$API_URL" == https://* ]]
      - name: Build exact-SHA product provenance
        env:
          HEAD_SHA: ${{ needs.authorize.outputs.product_sha }}
          UI_URL: ${{ needs.deploy.outputs.ui_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}
          WEBSOCKET_URL: ${{ needs.deploy.outputs.websocket_url }}
          CI_RUN_ID: ${{ needs.exact_main_ci.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.exact_main_ci.outputs.ci_run_attempt }}
          CI_RUN_URL: ${{ needs.exact_main_ci.outputs.ci_run_url }}
          CI_WORKFLOW_PATH: ${{ needs.exact_main_ci.outputs.ci_workflow_path }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("product-provenance.json").write_text(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "head_sha": os.environ["HEAD_SHA"],
              "ci_run_id": os.environ["CI_RUN_ID"],
              "ci_run_attempt": os.environ["CI_RUN_ATTEMPT"],
              "ci_run_url": os.environ["CI_RUN_URL"],
              "ci_workflow_path": os.environ["CI_WORKFLOW_PATH"],
              "ui_url": os.environ["UI_URL"],
              "api_url": os.environ["API_URL"],
              "websocket_url": os.environ["WEBSOCKET_URL"],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-provenance-${{ needs.authorize.outputs.product_sha }}-${{ github.run_attempt }}
          path: product-provenance.json
          retention-days: 90
