name: learning qualification

on:
  workflow_dispatch:
    inputs:
      sequence:
        description: Immutable qualification attempt sequence
        required: true
        type: choice
        options:
          - "1"
          - "2"

permissions: {}

concurrency:
  group: hindsight-demo-environment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  DATABASE_PARAMETER: ${{ vars.HINDSIGHT_DATABASE_URL_PARAM || '/hindsight/demo/database-url' }}
  GEMINI_PARAMETER: ${{ vars.HINDSIGHT_GEMINI_API_KEYS_PARAM || '/hindsight/demo/gemini-api-keys' }}
  GEMINI_MODEL: gemini-3.1-flash-lite
  GEMINI_EMBEDDING_MODEL: gemini-embedding-2
  EMBEDDING_PROVIDER: gemini
  LLM_PROVIDER: gemini

jobs:
  authorize:
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      qualification_sha: ${{ steps.authorization.outputs.qualification_sha }}
      sequence: ${{ steps.authorization.outputs.sequence }}
    steps:
      - id: authorization
        name: Resolve owner-authorized qualification revision
        env:
          REF_NAME: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          QUALIFICATION_SEQUENCE: ${{ inputs.sequence }}
        shell: bash
        run: |
          [[ "$REF_NAME" == "refs/heads/main" \
            && "$WORKFLOW_REF" == "$REPOSITORY/.github/workflows/learning-qualification.yml@$REF_NAME" \
            && "$ACTOR" == "$REPOSITORY_OWNER" \
            && "$TRIGGERING_ACTOR" == "$REPOSITORY_OWNER" \
            && "$EVENT_SHA" =~ ^[0-9a-f]{40}$ \
            && "$QUALIFICATION_SEQUENCE" =~ ^[12]$ ]] || {
            echo "Learning qualification requires the repository owner on exact main." >&2
            exit 1
          }
          echo "qualification_sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          echo "sequence=$QUALIFICATION_SEQUENCE" >> "$GITHUB_OUTPUT"

  exact_main_ci:
    needs: authorize
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.qualification_sha }}
          persist-credentials: false
      - name: Verify exact qualification revision
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.qualification_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Require unique successful exact-main CI
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_SHA: ${{ needs.authorize.outputs.qualification_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh api --method GET \
            "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$QUALIFICATION_SHA" \
            -f per_page=100 \
            > "$RUNNER_TEMP/exact-main-ci.json"
          python scripts/verify_ci_provenance.py \
            --repository "$REPOSITORY" \
            --sha "$QUALIFICATION_SHA" \
            < "$RUNNER_TEMP/exact-main-ci.json"

  claim:
    needs: [authorize, exact_main_ci]
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: demo
    permissions:
      contents: read
      id-token: write
    outputs:
      attempt_id: ${{ steps.claim.outputs.attempt_id }}
      family_sha256: ${{ steps.claim.outputs.family_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.qualification_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.HINDSIGHT_EVIDENCE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: claim
        name: Claim the immutable scientific family
        env:
          EVIDENCE_BUCKET: ${{ vars.HINDSIGHT_EVIDENCE_BUCKET }}
          QUALIFICATION_SEQUENCE: ${{ needs.authorize.outputs.sequence }}
          QUALIFICATION_SHA: ${{ needs.authorize.outputs.qualification_sha }}
          AUTHORIZED_BY: ${{ github.actor }}
        shell: bash
        run: |
          uv run python scripts/manage_qualification_family.py claim \
            --bucket "$EVIDENCE_BUCKET" \
            --sequence "$QUALIFICATION_SEQUENCE" \
            --actor "$AUTHORIZED_BY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --code-sha "$QUALIFICATION_SHA" \
            > "$RUNNER_TEMP/qualification-claim.json"
          echo "attempt_id=$(jq -r .attempt_id "$RUNNER_TEMP/qualification-claim.json")" >> "$GITHUB_OUTPUT"
          echo "family_sha256=$(jq -r .family_sha256 "$RUNNER_TEMP/qualification-claim.json")" >> "$GITHUB_OUTPUT"

  qualify:
    needs: [authorize, claim]
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: demo
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.qualification_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.HINDSIGHT_EVIDENCE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Prepare sanitized attempt record
        env:
          ATTEMPT_ID: ${{ needs.claim.outputs.attempt_id }}
          FAMILY_SHA256: ${{ needs.claim.outputs.family_sha256 }}
          QUALIFICATION_SEQUENCE: ${{ needs.authorize.outputs.sequence }}
          QUALIFICATION_SHA: ${{ needs.authorize.outputs.qualification_sha }}
        shell: bash
        run: |
          mkdir -p qualification-reports
          jq -n \
            --arg attempt_id "$ATTEMPT_ID" \
            --arg family_sha256 "$FAMILY_SHA256" \
            --arg sha "$QUALIFICATION_SHA" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --argjson sequence "$QUALIFICATION_SEQUENCE" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema_version:1,attempt_id:$attempt_id,family_sha256:$family_sha256,code_sha:$sha,workflow:$workflow,sequence:$sequence,run_id:$run_id,run_attempt:$run_attempt}' \
            > qualification-reports/attempt.json
      - name: Load and mask qualification settings
        env:
          HMAC_KEY_ID: ${{ vars.HINDSIGHT_QUALIFICATION_HMAC_KEY_ID }}
        shell: bash
        run: |
          [[ -n "$HMAC_KEY_ID" ]] || exit 1
          BASE_DATABASE_URL="$(aws ssm get-parameter --name "$DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          GEMINI_MATERIAL="$(aws ssm get-parameter --name "$GEMINI_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          for value in "$BASE_DATABASE_URL" "$GEMINI_MATERIAL"; do
            [[ -n "$value" && "$value" != "None" ]] || exit 1
            echo "::add-mask::$value"
          done
          while IFS= read -r api_key; do
            [[ -n "$api_key" ]] && echo "::add-mask::$api_key"
          done < <(
            GEMINI_API_KEYS="$GEMINI_MATERIAL" uv run python -c \
              'from hindsight.gemini import parse_gemini_credentials; import os; [print(item.api_key) for item in parse_gemini_credentials(os.environ)]'
          )
          DIAGNOSTIC_DATABASE_URL="$(BASE_DATABASE_URL="$BASE_DATABASE_URL" uv run python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit

          parts = urlsplit(os.environ["BASE_DATABASE_URL"])
          name = f"hindsight_diagnostic_{os.environ['GITHUB_RUN_ID']}_{os.environ['GITHUB_RUN_ATTEMPT']}"
          print(urlunsplit(parts._replace(path=f"/{name}")))
          PY
          )"
          echo "::add-mask::$DIAGNOSTIC_DATABASE_URL"
          delimiter="HINDSIGHT_GEMINI_KEYS_${GITHUB_RUN_ID}_${RANDOM}"
          {
            printf 'DATABASE_URL=%s\n' "$DIAGNOSTIC_DATABASE_URL"
            printf 'HINDSIGHT_QUALIFICATION_HMAC_KEY_ID=%s\n' "$HMAC_KEY_ID"
            echo "GEMINI_API_KEYS<<$delimiter"
            printf '%s\n' "$GEMINI_MATERIAL"
            echo "$delimiter"
          } >> "$GITHUB_ENV"
      - name: Initialize disposable diagnostic database
        run: |
          uv run python scripts/migrate.py
          uv run python scripts/initialize_agent_storage.py
      - id: diagnostic
        name: Run opaque confirmation qualification
        continue-on-error: true
        env:
          FAMILY_SHA256: ${{ needs.claim.outputs.family_sha256 }}
          QUALIFICATION_SEQUENCE: ${{ needs.authorize.outputs.sequence }}
          QUALIFICATION_SHA: ${{ needs.authorize.outputs.qualification_sha }}
        run: >-
          uv run python scripts/run_rank_diagnostics.py confirmation
          --code-sha "$QUALIFICATION_SHA"
          --qualification-sequence "$QUALIFICATION_SEQUENCE"
          --scientific-family-sha256 "$FAMILY_SHA256"
          --token-key-id "$HINDSIGHT_QUALIFICATION_HMAC_KEY_ID"
          --outcome-marker qualification-reports/outcome-accessed
          --max-distance 0.35
          --require-target-rank-one
          --output qualification-reports/qualification.json
      - name: Complete interrupted qualification report
        if: always()
        shell: bash
        run: |
          if [[ ! -s qualification-reports/qualification.json ]]; then
            uv run python scripts/manage_qualification_family.py infrastructure-report \
              --attempt qualification-reports/attempt.json \
              --outcome-marker qualification-reports/outcome-accessed \
              --output qualification-reports/qualification.json
          fi
      - id: seal
        name: Seal qualification attempt
        if: always()
        continue-on-error: true
        env:
          EVIDENCE_BUCKET: ${{ vars.HINDSIGHT_EVIDENCE_BUCKET }}
        shell: bash
        run: |
          uv run python scripts/seal_learning_evidence.py \
            --bucket "$EVIDENCE_BUCKET" \
            --evidence-id "qualification/run-${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}" \
            --object attempt=qualification-reports/attempt.json \
            --object report=qualification-reports/qualification.json \
            --receipt qualification-reports/receipt.json
      - id: finalize
        name: Finalize qualification-family authority
        if: always()
        continue-on-error: true
        env:
          EVIDENCE_BUCKET: ${{ vars.HINDSIGHT_EVIDENCE_BUCKET }}
          QUALIFICATION_SEQUENCE: ${{ needs.authorize.outputs.sequence }}
        shell: bash
        run: |
          database=()
          if [[ -n "${DATABASE_URL:-}" ]]; then
            database=(--database-url "$DATABASE_URL")
          fi
          uv run python scripts/manage_qualification_family.py finalize \
            --bucket "$EVIDENCE_BUCKET" \
            --sequence "$QUALIFICATION_SEQUENCE" \
            --report qualification-reports/qualification.json \
            --receipt qualification-reports/receipt.json \
            "${database[@]}"
      - name: Preserve qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-qualification-${{ needs.authorize.outputs.qualification_sha }}-sequence-${{ needs.authorize.outputs.sequence }}
          path: qualification-reports/*.json
          if-no-files-found: error
          retention-days: 90
      - id: cleanup
        name: Drop disposable diagnostic database
        if: always()
        continue-on-error: true
        run: uv run python scripts/drop_diagnostic_database.py
      - name: Require qualified, sealed, finalized, and cleaned evidence
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          SEAL_OUTCOME: ${{ steps.seal.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          [[ "$DIAGNOSTIC_OUTCOME" == "success" ]]
          [[ "$SEAL_OUTCOME" == "success" ]]
          [[ "$FINALIZE_OUTCOME" == "success" ]]
          [[ "$CLEANUP_OUTCOME" == "success" ]]

  qualification_complete:
    if: always()
    needs: [authorize, exact_main_ci, claim, qualify]
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Require complete opaque qualification
        env:
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          CI_RESULT: ${{ needs.exact_main_ci.result }}
          CLAIM_RESULT: ${{ needs.claim.result }}
          QUALIFY_RESULT: ${{ needs.qualify.result }}
        run: |
          [[ "$AUTHORIZE_RESULT" == "success" ]]
          [[ "$CI_RESULT" == "success" ]]
          [[ "$CLAIM_RESULT" == "success" ]]
          [[ "$QUALIFY_RESULT" == "success" ]]
