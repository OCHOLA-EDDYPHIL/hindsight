name: isolated exact-main capacity qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hindsight-capacity-qualification
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL }}
    outputs:
      source_sha: ${{ steps.authorization.outputs.source_sha }}
    steps:
      - id: authorization
        name: Require repository owner on an original exact-main run
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          [[ "$EVENT_NAME" == "workflow_dispatch" \
            && "$REF_NAME" == "refs/heads/main" \
            && "$WORKFLOW_REF" == "$REPOSITORY/.github/workflows/capacity-qualification.yml@$REF_NAME" \
            && "$ACTOR" == "$REPOSITORY_OWNER" \
            && "$TRIGGERING_ACTOR" == "$REPOSITORY_OWNER" \
            && "$RUN_ATTEMPT" == "1" \
            && "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Capacity qualification requires the repository owner on an original exact-main run." >&2
            exit 1
          }
          echo "source_sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"

  diagnostic:
    needs: authorize
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL }}
    timeout-minutes: 35
    env:
      CAPACITY_MODE: diagnostic
      COMPOSE_PROJECT_NAME: hindsight_capacity_${{ github.run_id }}_${{ github.run_attempt }}_diagnostic
      EXECUTION_ID: capacity_${{ github.run_id }}_${{ github.run_attempt }}_diagnostic
      COCKROACH_IMAGE: cockroachdb/cockroach@sha256:53f2dea6f5a666551f404bf6c341bde6595964cf786f24ade7d85249ccedecc7
      COCKROACH_IMAGE_ID: sha256:53f2dea6f5a666551f404bf6c341bde6595964cf786f24ade7d85249ccedecc7
      COCKROACH_START_ARGS: --store=type=mem,size=2GiB --cache=128MiB --max-sql-memory=128MiB --max-tsdb-memory=64MiB --max-go-memory=3GiB
      DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
      EVIDENCE_DIR: build/capacity-diagnostic
      SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
    steps:
      - name: Reject downstream rerun attempts
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RUN_ATTEMPT" = "1"
          test "$COMPOSE_PROJECT_NAME" = "hindsight_$EXECUTION_ID"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Run the isolated diagnostic under monitored memory pressure
        shell: bash
        run: |
          if ! timeout 30 docker image inspect "$COCKROACH_IMAGE" >/dev/null; then
            timeout 120 docker pull "$COCKROACH_IMAGE" >/dev/null
          fi
          test "$(timeout 30 docker image inspect --format '{{.Id}}' "$COCKROACH_IMAGE")" = "$COCKROACH_IMAGE_ID"
          test "$(timeout 30 docker image inspect --format '{{.Os}}/{{.Architecture}}' "$COCKROACH_IMAGE")" = "linux/amd64"
          runtime_prefix="$RUNNER_TEMP/hindsight-capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CAPACITY_MODE}"
          baseline="${runtime_prefix}.baseline.json"
          samples="${runtime_prefix}.samples.json"
          ready="${runtime_prefix}.ready"
          stop="${runtime_prefix}.stop"
          test ! -e "$baseline" && test ! -e "$samples" && test ! -e "$ready" && test ! -e "$stop"
          monitor_pid=""
          stop_monitor() {
            set +e
            touch "$stop"
            if [[ -n "$monitor_pid" ]]; then
              wait "$monitor_pid"
            fi
            return 0
          }
          trap stop_monitor EXIT INT TERM
          uv run python scripts/capture_capacity_runtime.py monitor \
            --source-revision "$SOURCE_SHA" \
            --mode "$CAPACITY_MODE" \
            --execution-id "$EXECUTION_ID" \
            --compose-project "$COMPOSE_PROJECT_NAME" \
            --baseline "$baseline" \
            --samples "$samples" \
            --ready "$ready" \
            --stop "$stop" &
          monitor_pid=$!
          monitor_ready=false
          for _ in $(seq 1 120); do
            if [[ -f "$ready" ]]; then
              monitor_ready=true
              break
            fi
            kill -0 "$monitor_pid"
            sleep 0.25
          done
          test "$monitor_ready" = true
          timeout 60 docker compose up -d crdb
          database_ready=false
          for _ in $(seq 1 12); do
            if timeout 5 docker compose exec -T crdb cockroach sql --insecure -e 'SELECT 1'; then
              database_ready=true
              break
            fi
            sleep 1
          done
          test "$database_ready" = true
          timeout 30 docker compose exec -T crdb cockroach sql --insecure \
            -e 'SET CLUSTER SETTING feature.vector_index.enabled = true'
          run_id="$(printf '%s' "$EXECUTION_ID" | sha256sum | cut -c1-16)"
          set +e
          uv run python scripts/run_capacity_qualification.py \
            --admin-url "$DATABASE_URL" \
            --run-id "$run_id" \
            --execution-id "$EXECUTION_ID" \
            --source-sha "$SOURCE_SHA" \
            --output-dir "$EVIDENCE_DIR" \
            --timeout-seconds 1200 \
            --mode "$CAPACITY_MODE"
          workload_status=$?
          touch "$stop"
          wait "$monitor_pid"
          monitor_status=$?
          set -e
          monitor_pid=""
          trap - EXIT INT TERM
          test "$workload_status" -eq 0
          test "$monitor_status" -eq 0
      - name: Remove isolated CockroachDB, finalize pressure, and verify storage cleanup
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          set +e
          timeout 120 docker compose down --volumes --remove-orphans
          down_status=$?
          runtime_prefix="$RUNNER_TEMP/hindsight-capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CAPACITY_MODE}"
          runtime_evidence_capture_status=0
          cp "${runtime_prefix}.baseline.json" "$EVIDENCE_DIR/runtime-pressure-baseline.json" \
            || runtime_evidence_capture_status=1
          cp "${runtime_prefix}.samples.json" "$EVIDENCE_DIR/runtime-pressure-samples.json" \
            || runtime_evidence_capture_status=1
          timeout 30 docker logs --tail 7200 "${COMPOSE_PROJECT_NAME}_runtime_probe" \
            > "$EVIDENCE_DIR/runtime-pressure-probe.tsv" \
            || runtime_evidence_capture_status=1
          uv run python scripts/capture_capacity_runtime.py finalize \
            --source-revision "$SOURCE_SHA" \
            --mode "$CAPACITY_MODE" \
            --execution-id "$EXECUTION_ID" \
            --compose-project "$COMPOSE_PROJECT_NAME" \
            --baseline "${runtime_prefix}.baseline.json" \
            --samples "${runtime_prefix}.samples.json" \
            --output "$EVIDENCE_DIR/runtime-pressure.json"
          runtime_finalize_status=$?
          uv run python scripts/capture_capacity_runtime.py cleanup-probe \
            --source-revision "$SOURCE_SHA" \
            --mode "$CAPACITY_MODE" \
            --execution-id "$EXECUTION_ID" \
            --compose-project "$COMPOSE_PROJECT_NAME"
          probe_cleanup_status=$?
          container_ids="$(timeout 30 docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
          container_query_status=$?
          volume_ids="$(timeout 30 docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
          volume_query_status=$?
          network_ids="$(timeout 30 docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
          network_query_status=$?
          probe_ids="$(timeout 30 docker ps -aq \
            --filter "label=hindsight.capacity.execution_id=$EXECUTION_ID" \
            --filter "label=hindsight.capacity.role=runtime-pressure-probe")"
          probe_query_status=$?
          containers="$(awk 'NF { count++ } END { print count + 0 }' <<< "$container_ids")"
          volumes="$(awk 'NF { count++ } END { print count + 0 }' <<< "$volume_ids")"
          networks="$(awk 'NF { count++ } END { print count + 0 }' <<< "$network_ids")"
          probes="$(awk 'NF { count++ } END { print count + 0 }' <<< "$probe_ids")"
          jq -n \
            --arg schema_version "hindsight.capacity_infrastructure_cleanup.v3" \
            --arg source_revision "$SOURCE_SHA" \
            --arg mode "$CAPACITY_MODE" \
            --arg execution_id "$EXECUTION_ID" \
            --arg compose_project "$COMPOSE_PROJECT_NAME" \
            --argjson down_status "$down_status" \
            --argjson runtime_evidence_capture_status "$runtime_evidence_capture_status" \
            --argjson runtime_finalize_status "$runtime_finalize_status" \
            --argjson probe_cleanup_status "$probe_cleanup_status" \
            --argjson container_query_status "$container_query_status" \
            --argjson volume_query_status "$volume_query_status" \
            --argjson network_query_status "$network_query_status" \
            --argjson probe_query_status "$probe_query_status" \
            --argjson remaining_containers "$containers" \
            --argjson remaining_volumes "$volumes" \
            --argjson remaining_networks "$networks" \
            --argjson remaining_probes "$probes" \
            '{schema_version: $schema_version, source_revision: $source_revision,
              mode: $mode, execution_id: $execution_id,
              compose_project: $compose_project, down_status: $down_status,
              runtime_evidence_capture_status: $runtime_evidence_capture_status,
              runtime_finalize_status: $runtime_finalize_status,
              probe_cleanup_status: $probe_cleanup_status,
              container_query_status: $container_query_status,
              volume_query_status: $volume_query_status,
              network_query_status: $network_query_status,
              probe_query_status: $probe_query_status,
              remaining_containers: $remaining_containers,
              remaining_volumes: $remaining_volumes,
              remaining_networks: $remaining_networks,
              remaining_probes: $remaining_probes,
              compose_state_removed: ($down_status == 0
                and $probe_cleanup_status == 0 and $container_query_status == 0
                and $volume_query_status == 0 and $network_query_status == 0
                and $probe_query_status == 0
                and $remaining_containers == 0
                and $remaining_volumes == 0 and $remaining_networks == 0
                and $remaining_probes == 0)}' \
            > "$EVIDENCE_DIR/infrastructure-cleanup.json"
          set -e
          test "$down_status" -eq 0
          test "$runtime_evidence_capture_status" -eq 0
          test "$runtime_finalize_status" -eq 0
          test "$probe_cleanup_status" -eq 0
          test "$container_query_status" -eq 0
          test "$volume_query_status" -eq 0
          test "$network_query_status" -eq 0
          test "$probe_query_status" -eq 0
          test "$containers" -eq 0
          test "$volumes" -eq 0
          test "$networks" -eq 0
          test "$probes" -eq 0
      - name: Validate the evidence-ineligible diagnostic gate
        if: always()
        shell: bash
        run: |
          uv run python scripts/validate_capacity_diagnostic.py \
            --input "$EVIDENCE_DIR/capacity-diagnostic.json" \
            --cleanup "$EVIDENCE_DIR/cleanup.json" \
            --runtime "$EVIDENCE_DIR/runtime-pressure.json" \
            --infrastructure-cleanup "$EVIDENCE_DIR/infrastructure-cleanup.json" \
            --source-revision "$SOURCE_SHA" \
            --execution-id "$EXECUTION_ID" \
            --output "$EVIDENCE_DIR/validated-capacity-diagnostic.json"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

  qualify:
    needs: [authorize, diagnostic]
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL }}
    timeout-minutes: 35
    env:
      CAPACITY_MODE: qualification
      COMPOSE_PROJECT_NAME: hindsight_capacity_${{ github.run_id }}_${{ github.run_attempt }}_qualification
      EXECUTION_ID: capacity_${{ github.run_id }}_${{ github.run_attempt }}_qualification
      COCKROACH_IMAGE: cockroachdb/cockroach@sha256:53f2dea6f5a666551f404bf6c341bde6595964cf786f24ade7d85249ccedecc7
      COCKROACH_IMAGE_ID: sha256:53f2dea6f5a666551f404bf6c341bde6595964cf786f24ade7d85249ccedecc7
      COCKROACH_START_ARGS: --store=type=mem,size=2GiB --cache=128MiB --max-sql-memory=128MiB --max-tsdb-memory=64MiB --max-go-memory=3GiB
      DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
      EVIDENCE_DIR: build/capacity-qualification
      SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
    steps:
      - name: Reject downstream rerun attempts
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RUN_ATTEMPT" = "1"
          test "$COMPOSE_PROJECT_NAME" = "hindsight_$EXECUTION_ID"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
