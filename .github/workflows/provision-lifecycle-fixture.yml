name: provision lifecycle fixture

on:
  workflow_dispatch:
    inputs:
      fixture_id:
        description: UUIDv4 retained by this dispatch and used for exact retries
        required: true
        type: string
      confirmation:
        description: Type create-lifecycle-fixture-<fixture UUID>
        required: true
        type: string
      deployment_environment:
        description: Protected deployed environment
        required: true
        type: choice
        default: demo
        options:
          - demo

permissions:
  contents: read
  id-token: write

concurrency:
  group: hindsight-${{ inputs.deployment_environment }}-environment-v2
  cancel-in-progress: false

jobs:
  provision:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL }}
    timeout-minutes: 15
    environment: ${{ inputs.deployment_environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      DEPLOYED_STAGE: ${{ vars.HINDSIGHT_STAGE }}
      DEPLOY_DATABASE_PARAMETER: ${{ vars.HINDSIGHT_DEPLOY_DATABASE_URL_PARAM }}
      HINDSIGHT_COGNITO_USER_POOL_ID: ${{ vars.HINDSIGHT_COGNITO_USER_POOL_ID }}
      HINDSIGHT_COGNITO_ISSUER: ${{ vars.HINDSIGHT_COGNITO_ISSUER }}
    steps:
      - name: Validate durable fixture identity
        shell: bash
        env:
          REQUESTED_FIXTURE_ID: ${{ inputs.fixture_id }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python - "$REQUESTED_FIXTURE_ID" <<'PY'
          import sys
          from uuid import UUID

          requested = sys.argv[1]
          try:
              parsed = UUID(requested)
          except ValueError as exc:
              raise SystemExit("fixture_id must be a canonical UUIDv4") from exc
          if parsed.version != 4 or str(parsed) != requested:
              raise SystemExit("fixture_id must be a canonical UUIDv4")
          PY
          test "$REQUESTED_CONFIRMATION" = "create-lifecycle-fixture-$REQUESTED_FIXTURE_ID"
          echo "Lifecycle fixture ID: $REQUESTED_FIXTURE_ID"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify fixed fixture environment
        shell: bash
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.deployment_environment }}
        run: |
          test -n "$EXPECTED_AWS_ACCOUNT_ID"
          test "$DEPLOYED_STAGE" = "$REQUESTED_ENVIRONMENT"
          test "$DEPLOY_DATABASE_PARAMETER" = "/hindsight/$DEPLOYED_STAGE/database-url"
          test -n "$HINDSIGHT_COGNITO_USER_POOL_ID"
          test "$HINDSIGHT_COGNITO_ISSUER" = "https://cognito-idp.$AWS_REGION.amazonaws.com/$HINDSIGHT_COGNITO_USER_POOL_ID"
          ACTUAL_AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACTUAL_AWS_ACCOUNT_ID" = "$EXPECTED_AWS_ACCOUNT_ID"
      - run: uv sync --frozen
      - name: Provision isolated fixture
        shell: bash
        env:
          REQUESTED_FIXTURE_ID: ${{ inputs.fixture_id }}
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DEPLOY_DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          mkdir -p build
          if uv run python scripts/provision_lifecycle_fixture.py \
              --region "$AWS_REGION" \
              --fixture-id "$REQUESTED_FIXTURE_ID" \
              --user-pool-id "$HINDSIGHT_COGNITO_USER_POOL_ID" \
              --issuer "$HINDSIGHT_COGNITO_ISSUER" \
              | tee build/lifecycle-fixture-receipt.json; then
            :
          else
            exit_code="${PIPESTATUS[0]}"
            jq -cn \
              --arg fixture_id "$REQUESTED_FIXTURE_ID" \
              '{fixture_id:$fixture_id,status:"failed"}' \
              > build/lifecycle-fixture-receipt.json
            exit "$exit_code"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-fixture-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/lifecycle-fixture-receipt.json
          if-no-files-found: error
          retention-days: 7
