name: destroy demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type destroy-<environment> to remove that application plane
        required: true
        type: string
      deployment_environment:
        description: Protected GitHub environment containing one AWS account configuration
        required: true
        type: choice
        default: demo
        options:
          - demo
          - demo-candidate

permissions:
  contents: read
  id-token: write

concurrency:
  group: hindsight-${{ inputs.deployment_environment || 'demo' }}-environment-v2
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  DEPLOY_DATABASE_PARAMETER: ${{ vars.HINDSIGHT_DEPLOY_DATABASE_URL_PARAM || '/hindsight/demo/database-url' }}
  TF_VAR_api_database_url_parameter_name: ${{ vars.HINDSIGHT_API_DATABASE_URL_PARAM || '/hindsight/demo/api-database-url' }}
  TF_VAR_worker_database_url_parameter_name: ${{ vars.HINDSIGHT_WORKER_DATABASE_URL_PARAM || '/hindsight/demo/worker-database-url' }}
  TF_VAR_gemini_api_keys_parameter_name: ${{ vars.HINDSIGHT_GEMINI_API_KEYS_PARAM || '/hindsight/demo/gemini-api-keys' }}
  TF_VAR_changefeed_token_parameter_name: ${{ vars.HINDSIGHT_CHANGEFEED_TOKEN_PARAM || '/hindsight/demo/changefeed-token' }}
  TF_VAR_enable_waf: ${{ vars.HINDSIGHT_ENABLE_WAF || 'false' }}
  TF_VAR_domain_name: ${{ vars.HINDSIGHT_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io' }}
  TF_VAR_acm_certificate_arn: ${{ vars.HINDSIGHT_ACM_CERTIFICATE_ARN }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.HINDSIGHT_RUNNER_LABEL }}
    environment: ${{ inputs.deployment_environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'hindsight/demo/terraform.tfstate' }}
      SOURCE_STATE_KEY: ${{ vars.HINDSIGHT_SOURCE_STATE_KEY || 'hindsight/demo/terraform.tfstate' }}
      SOURCE_DOMAIN_NAME: ${{ vars.HINDSIGHT_SOURCE_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io' }}
      TF_VAR_stage: ${{ vars.HINDSIGHT_STAGE || 'demo' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEPLOY_DATABASE_PARAMETER: ${{ vars.HINDSIGHT_DEPLOY_DATABASE_URL_PARAM || '/hindsight/demo/database-url' }}
      TF_VAR_api_database_url_parameter_name: ${{ vars.HINDSIGHT_API_DATABASE_URL_PARAM || '/hindsight/demo/api-database-url' }}
      TF_VAR_worker_database_url_parameter_name: ${{ vars.HINDSIGHT_WORKER_DATABASE_URL_PARAM || '/hindsight/demo/worker-database-url' }}
      TF_VAR_gemini_api_keys_parameter_name: ${{ vars.HINDSIGHT_GEMINI_API_KEYS_PARAM || '/hindsight/demo/gemini-api-keys' }}
      TF_VAR_changefeed_token_parameter_name: ${{ vars.HINDSIGHT_CHANGEFEED_TOKEN_PARAM || '/hindsight/demo/changefeed-token' }}
      TF_VAR_enable_waf: ${{ vars.HINDSIGHT_ENABLE_WAF || 'false' }}
      TF_VAR_domain_name: ${{ vars.HINDSIGHT_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io' }}
      TF_VAR_public_origin: ${{ vars.HINDSIGHT_PUBLIC_ORIGIN || format('https://{0}', vars.HINDSIGHT_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io') }}
      TF_VAR_cloudfront_aliases: ${{ vars.HINDSIGHT_CLOUDFRONT_ALIASES || format('["{0}"]', vars.HINDSIGHT_DOMAIN_NAME || 'hindsight.strathmoreedu.qzz.io') }}
      TF_VAR_manage_public_dns: ${{ vars.HINDSIGHT_MANAGE_PUBLIC_DNS || 'true' }}
      TF_VAR_runtime_active: ${{ vars.HINDSIGHT_RUNTIME_ACTIVE || 'true' }}
      TF_VAR_acm_certificate_arn: ${{ vars.HINDSIGHT_ACM_CERTIFICATE_ARN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Confirm destructive operation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
        run: test "$CONFIRMATION" = "destroy-$DEPLOYMENT_ENVIRONMENT"
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: hashicorp/setup-terraform@v4
      - uses: actions/cache@v6
        with:
          path: .terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: uv sync --frozen
      - name: Verify deployment account and state identity
        run: >-
          uv run python scripts/deployment_identity_preflight.py
          --expected-account-id "$EXPECTED_AWS_ACCOUNT_ID"
          --region "$AWS_REGION"
          --state-bucket "$TF_STATE_BUCKET"
          --certificate-arn "$TF_VAR_acm_certificate_arn"
          --deployment-environment "$DEPLOYMENT_ENVIRONMENT"
          --stage "$TF_VAR_stage"
          --state-key "$TF_STATE_KEY"
          --domain-name "$TF_VAR_domain_name"
          --source-state-key "$SOURCE_STATE_KEY"
          --source-domain-name "$SOURCE_DOMAIN_NAME"
      - run: uv run python scripts/build_lambda_artifacts.py
      - name: Initialize remote state
        run: >-
          terraform -chdir=infra/terraform/app init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TF_STATE_KEY"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Pause CockroachDB delivery before endpoint removal
        shell: bash
        run: |
          DATABASE_URL="$(aws ssm get-parameter --name "$DEPLOY_DATABASE_PARAMETER" --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          uv run python scripts/configure_changefeed.py pause
      - run: terraform -chdir=infra/terraform/app plan -destroy -input=false -out="$GITHUB_WORKSPACE/build/destroy.tfplan"
      - run: terraform -chdir=infra/terraform/app apply -input=false -auto-approve "$GITHUB_WORKSPACE/build/destroy.tfplan"
      - run: echo "Ephemeral AWS application resources were removed. CockroachDB, SSM values, and bootstrap state remain." >> "$GITHUB_STEP_SUMMARY"
