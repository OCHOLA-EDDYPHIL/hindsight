[project]
name = "hindsight"
version = "0.0.1.dev0"
description = "Incident-response copilot with rewindable, auditable agent memory on CockroachDB"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "boto3>=1.43.46",
    "certifi>=2026.6.17",
    "fastapi>=0.135.0",
    "google-genai>=2.11.0",
    "langchain-cockroachdb>=0.2.1",
    "langgraph>=1.2.9",
    "mcp>=1.28,<2",
    "mangum>=0.19.0",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "selenium>=4.30.0",
    "websockets>=15.0,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "migration_acceptance: isolated executable schema-upgrade acceptance",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
