[project]
name = "hindsight"
version = "0.0.1.dev0"
description = "Incident-response copilot with rewindable, auditable agent memory on CockroachDB"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "boto3>=1.43.46",
    "certifi>=2026.6.17",
    "google-genai>=2.11.0",
    "langchain-cockroachdb>=0.2.1",
    "langgraph>=1.2.9",
    "mcp>=1.28,<2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
