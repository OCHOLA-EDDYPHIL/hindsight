services:
  crdb:
    image: ${COCKROACH_IMAGE:-cockroachdb/cockroach:v25.4.5}
    command: start-single-node --insecure ${COCKROACH_START_ARGS:-}
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - crdb-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["otel"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  localstack:
    image: localstack/localstack:2026.07.3
    profiles: ["aws"]
    environment:
      SERVICES: sqs
      PERSISTENCE: "0"
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  crdb-data:
